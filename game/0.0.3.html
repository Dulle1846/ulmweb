<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASTLEFORGE • Eternal Realm</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --font-retro: 'Press Start 2P', system-ui;
        }
        
        canvas {
            image-rendering: pixelated;
            touch-action: none;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
            z-index: 50;
            animation: flicker 4s infinite alternate;
        }
        
        @keyframes flicker {
            0% { opacity: 0.4; }
            100% { opacity: 0.65; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden">

    <script>
        // ========================================================
        // CASTLEFORGE — Expanded Kingdom Sandbox (2026 Edition)
        // Much deeper simulation, random events, tech, morale, etc.
        // ========================================================
        
        const TILE_SIZE = 48
        const WORLD_WIDTH = 160
        const WORLD_HEIGHT = 160
        
        let canvas, ctx, minimapCanvas, minimapCtx
        let camera = { x: 0, y: 0 }
        let tick = 0
        let gameSpeed = 1
        let isPaused = false
        
        // Time-based tick system: x1 = ~3 ticks/sec, x2 = ~6, x4 = ~12
        const BASE_TICK_INTERVAL = 333 // ms between ticks at x1
        let tickAccumulator = 0
        let lastFrameTime = 0
        let gameOver = false
        let victory = false
        
        let kingdomName = "ELDRIA"
        
        // Resources
        let resources = {
            wood: 180,
            stone: 95,
            gold: 45,
            food: 120,
            research: 0
        }
        
        let incomeThisTick = {
            wood: 0, stone: 0, gold: 0, food: 0, research: 0
        }
        
        // Game state
        let morale = 72
        let seasonIndex = 0
        const SEASONS = ["SPRING", "SUMMER", "AUTUMN", "WINTER"]
        let year = 1
        let dayOfYear = 0
        
        let currentCard = null
        let selectedTab = 0
        let eventLog = []
        let techs = []
        let unlockedTechs = new Set()
        
        let entities = []
        let particles = []
        let floaters = []
        let world = []
        let explored = []
        
        let lastRandomEvent = 0
        let weather = "clear" // clear, rain, snow, storm
        let weatherTimer = 0
        
        let kingHp = 240
        let totalRaidsSurvived = 0
        
        // Types
        const TYPE = {
            KEEP: 0,
            HOUSE: 1,
            FARM: 2,
            LUMBER: 3,
            QUARRY: 4,
            TOWER: 5,
            WALL: 6,
            TAVERN: 7,
            TEMPLE: 8,
            BARRACKS: 9,
            MILL: 10,
            STABLE: 11,
            WONDER: 12,
            
            VILLAGER: 20,
            GUARD: 21,
            ARCHER: 22,
            KNIGHT: 23,
            PRIEST: 24,
            
            GOBLIN: 30,
            ORC: 31,
            TROLL: 32,
            
            DEER: 40,
            RUIN: 50
        }
        
        // Tech tree
        function initTechTree() {
            techs = [
                { id: "irrigation", name: "IRRIGATION", cost: 35, unlocked: false, effect: "Farms produce 40% more food", icon: "💧" },
                { id: "steel", name: "STEEL FORGING", cost: 55, unlocked: false, effect: "All military units +25 HP", icon: "⚔️" },
                { id: "scholarship", name: "SCHOLARSHIP", cost: 40, unlocked: false, effect: "Research income +2", icon: "📜" },
                { id: "feudalism", name: "FEUDAL SYSTEM", cost: 70, unlocked: false, effect: "Houses give +1 morale", icon: "🏛️" },
                { id: "alchemy", name: "ALCHEMY", cost: 85, unlocked: false, effect: "Gold mines occasionally spawn gold", icon: "🧪" },
            ]
        }
        
        // Card definitions
        const CARD_DECK = [
            {
                type: TYPE.HOUSE,
                name: "COTTAGE",
                desc: "Houses 3 villagers. +1 morale",
                cost: { wood: 30, stone: 10 },
                icon: "🏠"
            },
            {
                type: TYPE.FARM,
                name: "FARMSTEAD",
                desc: "Generates food every season",
                cost: { wood: 25, food: 5 },
                icon: "🌾"
            },
            {
                type: TYPE.LUMBER,
                name: "LUMBERYARD",
                desc: "Steady wood production",
                cost: { gold: 15 },
                icon: "🪵"
            },
            {
                type: TYPE.QUARRY,
                name: "STONE QUARRY",
                desc: "Stone & occasional gold",

                icon: "⛰️"
            },
            {
                type: TYPE.TOWER,
                name: "WATCHTOWER",

            },
            {

                name: "FORTIFIED WALL",
                desc: "Strong barrier vs raiders",

                icon: "🧱"
            },
            {
                type: TYPE.TAVERN,
                name: "THE TAVERN",
                desc: "Boosts morale and gold",
                cost: { wood: 55, gold: 25, food: 15 },
                icon: "🍺"
            },
            {
                type: TYPE.TEMPLE,
                name: "HOLY TEMPLE",
                desc: "Increases morale & heals",
                cost: { stone: 60, gold: 35 },
                icon: "⛪"
            },
            {
                type: TYPE.BARRACKS,
                name: "BARRACKS",
                desc: "Trains guards & knights",
                cost: { wood: 45, stone: 35 },
                icon: "🛡️"
            },
            {
                type: TYPE.MILL,
                name: "WATER MILL",
                desc: "Boosts nearby farms",
                cost: { wood: 65, stone: 20 },
                icon: "⚙️"
            },
            {
                type: TYPE.STABLE,
                name: "STABLES",
                desc: "Breeds war horses for knights",
                cost: { wood: 50, food: 40 },
                icon: "🐎"
            },
            {
                type: TYPE.KNIGHT,
                name: "ROYAL KNIGHT",
                desc: "Powerful mounted warrior",
                cost: { gold: 45, food: 25 },
                icon: "🗡️",
                unit: true
            },
            {
                type: TYPE.PRIEST,
                name: "SHRINE PRIEST",
                desc: "Heals allies, boosts morale",
                cost: { gold: 30, food: 20 },
                icon: "🙏",
                unit: true
            }
        ]
        
        let availableCards = []
        
        class Entity {
            constructor(x, y, type) {
                this.x = x
                this.y = y
                this.type = type
                this.hp = this.getMaxHp()
                this.maxHp = this.hp
                this.dead = false
                this.age = 0
                this.facing = Math.random() > 0.5 ? 1 : -1
                this.anim = Math.random() * 100
                this.targetX = x
                this.targetY = y
                this.state = "idle"
                this.job = null
                this.home = null
                this.moraleMod = 0
                this.tint = Math.floor(Math.random() * 4) // stable color variation (no flicker)
            }
            
            getMaxHp() {
                switch(this.type) {
                    case TYPE.KEEP: return 1200
                    case TYPE.HOUSE: return 180
                    case TYPE.FARM: return 90
                    case TYPE.LUMBER: return 110
                    case TYPE.QUARRY: return 140
                    case TYPE.WALL: return 450
                    case TYPE.TOWER: return 220
                    case TYPE.TAVERN: return 160
                    case TYPE.TEMPLE: return 210
                    case TYPE.BARRACKS: return 280
                    case TYPE.MILL: return 130
                    case TYPE.STABLE: return 170
                    case TYPE.WONDER: return 9999
                    case TYPE.VILLAGER: return 35
                    case TYPE.GUARD: return 160
                    case TYPE.ARCHER: return 95
                    case TYPE.KNIGHT: return 240
                    case TYPE.PRIEST: return 70
                    case TYPE.GOBLIN: return 45
                    case TYPE.ORC: return 110
                    case TYPE.TROLL: return 240
                    case TYPE.DEER: return 25
                    default: return 100
                }
            }
            
            isBuilding() {
                return this.type < 20
            }
            
            isUnit() {
                return this.type >= 20 && this.type < 30
            }
            
            isEnemy() {
                return this.type >= 30 && this.type < 40
            }
        }
        
        function rand(min, max) {
            return Math.random() * (max - min) + min
        }
        
        function randInt(min, max) {
            return Math.floor(rand(min, max))
        }
        
        function distance(x1, y1, x2, y2) {
            return Math.hypot(x1 - x2, y1 - y2)
        }
        
        function initWorld() {
            world = []
            explored = []
            
            for (let x = 0; x < WORLD_WIDTH; x++) {
                world[x] = []
                explored[x] = []
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    explored[x][y] = false
                    
                    const r = Math.random()
                    
                    if (r < 0.07) {
                        world[x][y] = { terrain: "water", variant: randInt(0, 3) }
                    } else if (r < 0.3) {
                        world[x][y] = { terrain: "forest", variant: randInt(0, 4) }
                    } else if (r < 0.37) {
                        world[x][y] = { terrain: "rock", variant: randInt(0, 3) }
                    } else if (r < 0.4) {
                        world[x][y] = { terrain: "ruins", variant: randInt(0, 2) }
                    } else {
                        world[x][y] = { terrain: "grass", variant: randInt(0, 5) }
                    }
                }
            }
            
            // Central fertile valley
            const cx = Math.floor(WORLD_WIDTH / 2)
            const cy = Math.floor(WORLD_HEIGHT / 2)
            
            for (let x = cx - 18; x <= cx + 18; x++) {
                for (let y = cy - 18; y <= cy + 18; y++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue
                    if (world[x][y].terrain === "water") continue
                    world[x][y].terrain = "grass"
                    world[x][y].variant = 0
                }
            }
            
            // Reveal starting area
            revealArea(cx, cy, 22)
        }
        
        function revealArea(tx, ty, radius) {
            for (let x = tx - radius; x <= tx + radius; x++) {
                for (let y = ty - radius; y <= ty + radius; y++) {
                    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue
                    if (distance(tx, ty, x, y) < radius) {
                        explored[x][y] = true
                    }
                }
            }
        }
        
        function spawnEntity(tx, ty, type) {
            const entity = new Entity(tx, ty, type)
            
            // special initializations
            if (type === TYPE.VILLAGER) {
                entity.home = { x: tx, y: ty }
            }
            
            if (type === TYPE.KEEP) {
                entity.hp = 1200
            }
            
            entities.push(entity)
            return entity
        }
        
        function buildingAt(tx, ty) {
            return entities.find(e => {
                return !e.dead && e.isBuilding() && Math.floor(e.x) === tx && Math.floor(e.y) === ty
            })
        }
        
        function getEntitiesOfType(type) {
            return entities.filter(e => !e.dead && e.type === type)
        }
        
        function initStartingKingdom() {
            const cx = Math.floor(WORLD_WIDTH / 2)
            const cy = Math.floor(WORLD_HEIGHT / 2)
            
            // Main keep
            spawnEntity(cx, cy, TYPE.KEEP)
            
            // Initial buildings
            spawnEntity(cx - 5, cy - 3, TYPE.HOUSE)
            spawnEntity(cx + 6, cy - 6, TYPE.HOUSE)
            spawnEntity(cx - 3, cy + 7, TYPE.HOUSE)
            
            spawnEntity(cx + 8, cy + 4, TYPE.FARM)
            spawnEntity(cx + 9, cy + 5, TYPE.FARM)
            spawnEntity(cx - 8, cy - 8, TYPE.LUMBER)
            spawnEntity(cx + 2, cy + 10, TYPE.QUARRY)
            spawnEntity(cx - 10, cy + 2, TYPE.TEMPLE)
            
            // Units
            const king = spawnEntity(cx + 1, cy - 2, TYPE.KNIGHT)
            king.hp = 300 // the king is a knight
            
            for (let i = 0; i < 6; i++) {
                const v = spawnEntity(
                    cx + randInt(-6, 6), 
                    cy + randInt(-6, 6), 
                    TYPE.VILLAGER
                )
                v.home = { x: cx + randInt(-4, 4), y: cy + randInt(-4, 4) }
            }
            
            // A few guards
            spawnEntity(cx - 4, cy - 1, TYPE.GUARD)
            spawnEntity(cx + 4, cy + 1, TYPE.GUARD)
        }
        
        function drawTerrain(x, y, tile) {
            const px = x * TILE_SIZE
            const py = y * TILE_SIZE
            
            // deterministic per-tile "random" so nothing flickers between frames
            const seed = ((x * 73856093) ^ (y * 19349663)) >>> 0
            const s1 = (seed % 100) / 100
            const s2 = ((seed >> 4) % 100) / 100
            
            if (tile.terrain === "water") {
                ctx.fillStyle = "#1a5276"
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE)
                // gentle animated waves (smooth, not flickering)
                const waveOff = Math.sin(tick * 0.08 + x * 1.3 + y * 0.7) * 4
                ctx.fillStyle = "#2980b9"
                ctx.fillRect(px + 4, py + 12 + waveOff, TILE_SIZE - 12, 4)
                ctx.fillStyle = "rgba(174, 214, 241, 0.35)"
                ctx.fillRect(px + 10, py + 28 - waveOff, TILE_SIZE - 22, 3)
                return
            }
            
            // grass base — warmer cartoon greens
            const grassShades = ["#3e7c3e", "#478a47", "#3a743a"]
            ctx.fillStyle = grassShades[(x + y * 3) % 3]
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE)
            
            // subtle checker texture
            if ((x + y) % 2 === 0) {
                ctx.fillStyle = "rgba(255,255,255,0.03)"
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE)
            }
            
            if (tile.terrain === "forest") {
                const tx = px + TILE_SIZE / 2
                const ty = py + TILE_SIZE / 2
                const sway = Math.sin(tick * 0.05 + x * 0.9 + y * 1.4) * 1.5
                
                // trunk
                ctx.fillStyle = "#5d4028"
                ctx.fillRect(tx - 4, ty + 2, 8, 16)
                ctx.fillStyle = "#4a3220"
                ctx.fillRect(tx - 4, ty + 2, 3, 16)
                
                // canopy with cartoon outline
                ctx.fillStyle = "#1e4620"
                ctx.beginPath()
                ctx.arc(tx + sway, ty - 4, 19, 0, Math.PI * 2)
                ctx.fill()
                
                ctx.fillStyle = "#2d6b30"
                ctx.beginPath()
                ctx.arc(tx + sway, ty - 4, 16, 0, Math.PI * 2)
                ctx.arc(tx - 9 + sway, ty + 2, 11, 0, Math.PI * 2)
                ctx.arc(tx + 9 + sway, ty + 2, 11, 0, Math.PI * 2)
                ctx.fill()
                
                // highlight blob (cartoon shine)
                ctx.fillStyle = "#4a9e4e"
                ctx.beginPath()
                ctx.arc(tx - 5 + sway, ty - 10, 8, 0, Math.PI * 2)
                ctx.fill()
                ctx.fillStyle = "#65c46a"
                ctx.beginPath()
                ctx.arc(tx - 7 + sway, ty - 12, 4, 0, Math.PI * 2)
                ctx.fill()
            } 
            else if (tile.terrain === "rock") {
                const rx = px + TILE_SIZE / 2
                const ry = py + TILE_SIZE / 2
                // boulder with outline
                ctx.fillStyle = "#3d3d3d"
                ctx.beginPath()
                ctx.moveTo(rx - 16, ry + 14)
                ctx.lineTo(rx - 12, ry - 6)
                ctx.lineTo(rx - 2, ry - 14)
                ctx.lineTo(rx + 12, ry - 8)
                ctx.lineTo(rx + 16, ry + 14)
                ctx.closePath()
                ctx.fill()
                ctx.fillStyle = "#6e6e6e"
                ctx.beginPath()
                ctx.moveTo(rx - 12, ry + 12)
                ctx.lineTo(rx - 9, ry - 4)
                ctx.lineTo(rx - 1, ry - 11)
                ctx.lineTo(rx + 9, ry - 6)
                ctx.lineTo(rx + 12, ry + 12)
                ctx.closePath()
                ctx.fill()
                // highlight
                ctx.fillStyle = "#9a9a9a"
                ctx.beginPath()
                ctx.moveTo(rx - 8, ry - 2)
                ctx.lineTo(rx - 2, ry - 9)
                ctx.lineTo(rx + 3, ry - 5)
                ctx.lineTo(rx - 4, ry + 1)
                ctx.closePath()
                ctx.fill()
                // small pebble
                if (s1 > 0.5) {
                    ctx.fillStyle = "#5a5a5a"
                    ctx.beginPath()
                    ctx.arc(px + 10 + s2 * 8, py + TILE_SIZE - 8, 3, 0, Math.PI * 2)
                    ctx.fill()
                }
            } 
            else if (tile.terrain === "ruins") {
                // broken column + rubble
                ctx.fillStyle = "#2a2a2a"
                ctx.fillRect(px + 10, py + 26, TILE_SIZE - 18, 10)
                ctx.fillStyle = "#8a8577"
                ctx.fillRect(px + 16, py + 8, 10, 22)
                ctx.fillStyle = "#a29b8a"
                ctx.fillRect(px + 16, py + 8, 4, 22)
                ctx.fillStyle = "#6e695e"
                ctx.fillRect(px + 14, py + 5, 14, 5)
                // rubble stones
                ctx.fillStyle = "#7d7869"
                ctx.beginPath()
                ctx.arc(px + 32, py + 30, 4, 0, Math.PI * 2)
                ctx.arc(px + 12, py + 34, 3, 0, Math.PI * 2)
                ctx.fill()
                // moss
                ctx.fillStyle = "#3f6b3f"
                ctx.fillRect(px + 16, py + 24, 10, 4)
            }
            
            // deterministic grass tufts & flowers (no flicker)
            if (tile.terrain === "grass") {
                if (s1 > 0.72) {
                    ctx.strokeStyle = "#2c5a2c"
                    ctx.lineWidth = 2
                    ctx.beginPath()
                    ctx.moveTo(px + 8 + s2 * 24, py + TILE_SIZE - 6)
                    ctx.lineTo(px + 6 + s2 * 24, py + TILE_SIZE - 15)
                    ctx.moveTo(px + 12 + s2 * 24, py + TILE_SIZE - 6)
                    ctx.lineTo(px + 14 + s2 * 24, py + TILE_SIZE - 14)
                    ctx.stroke()
                }
                if (s2 > 0.9) {
                    // little flower
                    const fx = px + 10 + s1 * 26
                    const fy = py + 10 + s2 * 20
                    ctx.fillStyle = s1 > 0.85 ? "#e8638c" : "#f5f1d0"
                    ctx.beginPath()
                    ctx.arc(fx, fy, 3, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.fillStyle = "#f2c744"
                    ctx.beginPath()
                    ctx.arc(fx, fy, 1.4, 0, Math.PI * 2)
                    ctx.fill()
                }
            }
        }
        
        // cartoon outline helper
        function outlinedRect(x, y, w, h, fill, outline = "#1a1208") {
            ctx.fillStyle = outline
            ctx.fillRect(x - 2, y - 2, w + 4, h + 4)
            ctx.fillStyle = fill
            ctx.fillRect(x, y, w, h)
        }
        
        function outlinedCircle(x, y, r, fill, outline = "#1a1208") {
            ctx.fillStyle = outline
            ctx.beginPath()
            ctx.arc(x, y, r + 2, 0, Math.PI * 2)
            ctx.fill()
            ctx.fillStyle = fill
            ctx.beginPath()
            ctx.arc(x, y, r, 0, Math.PI * 2)
            ctx.fill()
        }
        
        function drawFace(x, y, skin = "#f0c8a0", eyeColor = "#1a1208") {
            outlinedCircle(x, y, 8, skin)
            // eyes
            ctx.fillStyle = eyeColor
            ctx.fillRect(x - 4, y - 2, 2.5, 3.5)
            ctx.fillRect(x + 2, y - 2, 2.5, 3.5)
            // rosy cheeks
            ctx.fillStyle = "rgba(230,120,110,0.4)"
            ctx.beginPath()
            ctx.arc(x - 5, y + 3, 2, 0, Math.PI * 2)
            ctx.arc(x + 5, y + 3, 2, 0, Math.PI * 2)
            ctx.fill()
        }
        
        function drawEntity(e) {
            if (e.dead) return
            
            const px = e.x * TILE_SIZE + TILE_SIZE / 2
            const py = e.y * TILE_SIZE + TILE_SIZE / 2
            const bob = Math.sin(tick * 0.1 + e.anim) * 2.5
            e.anim += 0.08
            
            // shadow
            ctx.globalAlpha = 0.3
            ctx.fillStyle = "#111"
            ctx.beginPath()
            ctx.ellipse(px + 3, py + 18 + bob * 0.3, 18, 6, 0, 0, Math.PI * 2)
            ctx.fill()
            ctx.globalAlpha = 1
            
            switch (e.type) {
                case TYPE.KEEP: {
                    // main body with outline
                    outlinedRect(px - 34, py - 36, 68, 52, "#8a8578")

                    ctx.fillStyle = "#767162"
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 4; c++) {
                            if ((r + c) % 2 === 0) ctx.fillRect(px - 30 + c * 16, py - 30 + r * 15, 13, 11)
                        }
                    }
                    // battlements
                    ctx.fillStyle = "#6e695c"
                    for (let i = 0; i < 5; i++) {

                    ctx.fillRect(px - 12, py - 68, 7, 8)
                    ctx.fillRect(px + 5, py - 68, 7, 8)

                    ctx.fill()
                    ctx.fillRect(px - 11, py + 6, 22, 10)
                    // gate bars
                    ctx.strokeStyle = "#4a3826"
                    ctx.lineWidth = 2
                    for (let i = -1; i <= 1; i++) {
                        ctx.beginPath()
                        ctx.moveTo(px + i * 6, py - 2)
                        ctx.lineTo(px + i * 6, py + 16)
                        ctx.stroke()
                    }
                    // waving flag
                    const flagWave = Math.sin(tick * 0.15) * 3
                    ctx.fillStyle = "#8a7a6a"
                    ctx.fillRect(px - 1, py - 84, 3, 24)
                    ctx.fillStyle = "#d92626"
                    ctx.beginPath()
                    ctx.moveTo(px + 2, py - 84)
                    ctx.lineTo(px + 24, py - 80 + flagWave)
                    ctx.lineTo(px + 2, py - 72)
                    ctx.closePath()
                    ctx.fill()
                    ctx.fillStyle = "#facc15"
                    ctx.beginPath()
                    ctx.arc(px + 9, py - 78 + flagWave * 0.4, 2.5, 0, Math.PI * 2)
                    ctx.fill()
                    // windows glow
                    ctx.fillStyle = "#ffdf80"
                    ctx.fillRect(px - 6, py - 54, 5, 7)
                    ctx.fillRect(px + 2, py - 54, 5, 7)
                    break
                }
                    
                case TYPE.HOUSE: {
                    // walls (timber-frame cottage)
                    outlinedRect(px - 19, py - 12, 38, 28, "#e8d5b0")

                    ctx.fillStyle = "#6b4a2e"

                    ctx.fill()
                    ctx.fillStyle = "#b5432e"
                    ctx.beginPath()

                    ctx.lineTo(px, py - 34)

                    ctx.closePath()
                    ctx.fill()
                    // roof highlight
                    ctx.fillStyle = "#d15a42"
                    ctx.beginPath()
                    ctx.moveTo(px - 16, py - 14)
                    ctx.lineTo(px - 2, py - 29)
                    ctx.lineTo(px + 4, py - 26)
                    ctx.lineTo(px - 10, py - 14)
                    ctx.closePath()
                    ctx.fill()
                    // door
                    ctx.fillStyle = "#5d4028"
                    ctx.fillRect(px - 14, py + 2, 9, 14)
                    ctx.fillStyle = "#f2c744"
                    ctx.beginPath()
                    ctx.arc(px - 7.5, py + 9, 1.3, 0, Math.PI * 2)
                    ctx.fill()
                    // window with warm light
                    ctx.fillStyle = "#4a3826"
                    ctx.fillRect(px + 4, py - 4, 11, 10)
                    ctx.fillStyle = "#ffd77a"
                    ctx.fillRect(px + 5.5, py - 2.5, 8, 7)
                    ctx.strokeStyle = "#4a3826"
                    ctx.lineWidth = 1.5
                    ctx.beginPath()
                    ctx.moveTo(px + 9.5, py - 3)
                    ctx.lineTo(px + 9.5, py + 5)
                    ctx.stroke()
                    // chimney + smoke puff
                    ctx.fillStyle = "#7d7264"
                    ctx.fillRect(px + 10, py - 32, 7, 12)
                    const puff = (tick * 0.5) % 30
                    ctx.fillStyle = `rgba(220,220,220,${0.5 - puff / 70})`
                    ctx.beginPath()
                    ctx.arc(px + 13 + puff * 0.15, py - 36 - puff * 0.6, 3.5 + puff * 0.12, 0, Math.PI * 2)
                    ctx.fill()
                    break
                }
                    
                case TYPE.FARM: {
                    // tilled soil plot with outline
                    outlinedRect(px - 23, py - 14, 46, 32, "#6e4f30")
                    // soil rows
                    ctx.fillStyle = "#5a3f25"
                    for (let i = 0; i < 4; i++) {
                        ctx.fillRect(px - 21, py - 10 + i * 7, 42, 3)
                    }
                    // wheat stalks with sway
                    const wheatSway = Math.sin(tick * 0.06 + e.anim) * 1.5
                    for (let i = -2; i <= 2; i++) {
                        ctx.strokeStyle = "#c9a83c"
                        ctx.lineWidth = 2.5
                        ctx.beginPath()
                        ctx.moveTo(px + i * 9, py + 14)
                        ctx.quadraticCurveTo(px + i * 9 + wheatSway, py - 2, px + i * 9 + wheatSway * 1.6, py - 16)
                        ctx.stroke()
                        // wheat head
                        ctx.fillStyle = "#f2d264"
                        ctx.beginPath()
                        ctx.ellipse(px + i * 9 + wheatSway * 1.6, py - 19, 3, 6, wheatSway * 0.1, 0, Math.PI * 2)
                        ctx.fill()
                    }
                    // little scarecrow
                    ctx.fillStyle = "#5d4028"
                    ctx.fillRect(px + 17, py - 22, 2.5, 20)
                    ctx.fillRect(px + 11, py - 17, 15, 2.5)
                    ctx.fillStyle = "#e0a33c"
                    ctx.beginPath()
                    ctx.arc(px + 18, py - 25, 4, 0, Math.PI * 2)
                    ctx.fill()
                    break
                }
                    
                case TYPE.LUMBER: {
                    // log cabin
                    outlinedRect(px - 18, py - 8, 36, 26, "#7a5230")
                    // horizontal log lines
                    ctx.strokeStyle = "#5d4028"
                    ctx.lineWidth = 2
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath()
                        ctx.moveTo(px - 18, py - 2 + i * 8)
                        ctx.lineTo(px + 18, py - 2 + i * 8)
                        ctx.stroke()
                    }
                    // slanted roof
                    ctx.fillStyle = "#4a5d3a"
                    ctx.beginPath()
                    ctx.moveTo(px - 22, py - 6)
                    ctx.lineTo(px, py - 22)
                    ctx.lineTo(px + 22, py - 6)
                    ctx.closePath()
                    ctx.fill()
                    // stacked logs beside
                    ctx.fillStyle = "#8a6238"
                    ctx.beginPath()
                    ctx.arc(px - 26, py + 12, 5, 0, Math.PI * 2)
                    ctx.arc(px - 26, py + 3, 5, 0, Math.PI * 2)
                    ctx.arc(px - 32, py + 8, 5, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.fillStyle = "#d9b380"
                    ctx.beginPath()
                    ctx.arc(px - 26, py + 12, 2.5, 0, Math.PI * 2)
                    ctx.arc(px - 26, py + 3, 2.5, 0, Math.PI * 2)
                    ctx.arc(px - 32, py + 8, 2.5, 0, Math.PI * 2)
                    ctx.fill()
                    // axe in stump
                    ctx.fillStyle = "#6e4f30"
                    ctx.fillRect(px + 22, py + 6, 10, 10)
                    ctx.strokeStyle = "#8a8578"
                    ctx.lineWidth = 3
                    ctx.beginPath()
                    ctx.moveTo(px + 27, py + 8)
                    ctx.lineTo(px + 33, py - 2)
                    ctx.stroke()
                    break
                }
                    
                case TYPE.QUARRY: {
                    // rocky pit
                    outlinedRect(px - 22, py - 10, 44, 28, "#5f5b52")
                    ctx.fillStyle = "#4a463e"
                    ctx.beginPath()
                    ctx.ellipse(px, py + 4, 16, 10, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.fillStyle = "#2e2b26"
                    ctx.beginPath()
                    ctx.ellipse(px, py + 4, 10, 6, 0, 0, Math.PI * 2)
                    ctx.fill()
                    // wooden crane frame
                    ctx.strokeStyle = "#5d4028"
                    ctx.lineWidth = 3
                    ctx.beginPath()
                    ctx.moveTo(px - 14, py - 8)
                    ctx.lineTo(px - 4, py - 26)
                    ctx.lineTo(px + 10, py - 20)
                    ctx.stroke()
                    // rope + bucket
                    ctx.strokeStyle = "#8a7a5a"
                    ctx.lineWidth = 1.5
                    ctx.beginPath()
                    ctx.moveTo(px + 10, py - 20)
                    ctx.lineTo(px + 10, py - 4)
                    ctx.stroke()
                    ctx.fillStyle = "#6e5a3a"
                    ctx.fillRect(px + 6, py - 4, 8, 6)
                    // stone piles
                    ctx.fillStyle = "#8a867c"
                    ctx.beginPath()
                    ctx.arc(px - 16, py + 12, 4, 0, Math.PI * 2)
                    ctx.arc(px - 10, py + 14, 3.5, 0, Math.PI * 2)
                    ctx.fill()
                    break
                }
                    
                case TYPE.TOWER: {
                    // stone tower with taper
                    ctx.fillStyle = "#1a1208"
                    ctx.fillRect(px - 15, py - 44, 30, 60)
                    ctx.fillStyle = "#8a8578"
                    ctx.fillRect(px - 13, py - 42, 26, 56)
                    // brick pattern
                    ctx.fillStyle = "#767162"
                    for (let r = 0; r < 5; r++) {
                        ctx.fillRect(px - 13 + (r % 2) * 7, py - 38 + r * 10, 12, 7)
                    }
                    // top platform
                    outlinedRect(px - 19, py - 52, 38, 12, "#6e695c")
                    // battlements
                    ctx.fillStyle = "#6e695c"
                    ctx.fillRect(px - 19, py - 58, 8, 8)
                    ctx.fillRect(px - 4, py - 58, 8, 8)
                    ctx.fillRect(px + 11, py - 58, 8, 8)
                    // arrow slit
                    ctx.fillStyle = "#1a1208"
                    ctx.fillRect(px - 2, py - 30, 4, 12)
                    // archer silhouette on top with animated bow
                    ctx.fillStyle = "#3a4a2e"
                    ctx.fillRect(px - 4, py - 66, 8, 9)
                    ctx.beginPath()
                    ctx.arc(px, py - 68, 3.5, 0, Math.PI * 2)
                    ctx.fill()
                    break
                }
                    
                case TYPE.WALL: {
                    outlinedRect(px - 22, py - 16, 44, 34, "#8a8578")
                    // brick rows
                    ctx.strokeStyle = "#6e695c"
                    ctx.lineWidth = 2
                    for (let r = 0; r < 3; r++) {
                        ctx.beginPath()
                        ctx.moveTo(px - 22, py - 6 + r * 10)
                        ctx.lineTo(px + 22, py - 6 + r * 10)
                        ctx.stroke()
                        for (let c = 0; c < 3; c++) {
                            ctx.beginPath()
                            ctx.moveTo(px - 14 + c * 14 + (r % 2) * 7, py - 16 + r * 10)
                            ctx.lineTo(px - 14 + c * 14 + (r % 2) * 7, py - 6 + r * 10)
                            ctx.stroke()
                        }
                    }
                    // battlements
                    ctx.fillStyle = "#6e695c"
                    for (let i = 0; i < 4; i++) {
                        ctx.fillRect(px - 22 + i * 12, py - 24, 8, 9)
                    }
                    break
                }
                    
                case TYPE.TAVERN: {
                    // cozy two-story inn
                    outlinedRect(px - 21, py - 16, 42, 32, "#a3764a")
                    ctx.fillStyle = "#8a5f38"
                    ctx.fillRect(px - 21, py - 16, 42, 14)
                    // roof
                    ctx.fillStyle = "#1a1208"
                    ctx.beginPath()
                    ctx.moveTo(px - 28, py - 14)
                    ctx.lineTo(px, py - 40)
                    ctx.lineTo(px + 28, py - 14)
                    ctx.closePath()
                    ctx.fill()
                    ctx.fillStyle = "#5a4632"
                    ctx.beginPath()
                    ctx.moveTo(px - 24, py - 16)
                    ctx.lineTo(px, py - 36)
                    ctx.lineTo(px + 24, py - 16)
                    ctx.closePath()
                    ctx.fill()
                    // glowing windows
                    ctx.fillStyle = "#ffd77a"
                    ctx.fillRect(px - 15, py - 12, 8, 7)
                    ctx.fillRect(px + 7, py - 12, 8, 7)
                    ctx.fillRect(px - 15, py + 2, 8, 8)
                    // door
                    ctx.fillStyle = "#3d2c1a"
                    ctx.fillRect(px + 4, py + 2, 11, 14)
                    // hanging mug sign
                    ctx.strokeStyle = "#4a3826"
                    ctx.lineWidth = 2
                    ctx.beginPath()
                    ctx.moveTo(px + 21, py - 18)
                    ctx.lineTo(px + 30, py - 18)
                    ctx.stroke()
                    const signSway = Math.sin(tick * 0.1) * 2
                    ctx.fillStyle = "#e0a33c"
                    ctx.fillRect(px + 26 + signSway, py - 16, 8, 9)
                    ctx.fillStyle = "#fff"
                    ctx.fillRect(px + 27 + signSway, py - 15, 6, 2.5)
                    break
                }
                    
                case TYPE.TEMPLE: {
                    // white marble temple
                    outlinedRect(px - 22, py - 14, 44, 30, "#e8e2d2")
                    // columns
                    ctx.fillStyle = "#c9c2b0"
                    for (let i = 0; i < 4; i++) {
                        ctx.fillRect(px - 18 + i * 11, py - 12, 5, 26)
                    }
                    // pediment roof
                    ctx.fillStyle = "#1a1208"
                    ctx.beginPath()
                    ctx.moveTo(px - 28, py - 12)
                    ctx.lineTo(px, py - 34)
                    ctx.lineTo(px + 28, py - 12)
                    ctx.closePath()
                    ctx.fill()
                    ctx.fillStyle = "#d9d2c0"
                    ctx.beginPath()
                    ctx.moveTo(px - 24, py - 14)
                    ctx.lineTo(px, py - 31)
                    ctx.lineTo(px + 24, py - 14)
                    ctx.closePath()
                    ctx.fill()
                    // golden symbol with glow pulse
                    const glow = 0.5 + Math.sin(tick * 0.08) * 0.3

                    ctx.beginPath()
                    ctx.arc(px, py - 22, 7, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.fillStyle = "#f2c744"
                    ctx.beginPath()
                    ctx.arc(px, py - 22, 4, 0, Math.PI * 2)
                    ctx.fill()

                }
                    
                case TYPE.BARRACKS: {
                    // sturdy military hall
                    outlinedRect(px - 24, py - 12, 48, 30, "#6e5a48")
                    ctx.fillStyle = "#5a4a3c"
                    ctx.fillRect(px - 24, py - 12, 48, 6)
                    // flat crenelated roof
                    ctx.fillStyle = "#4a3e32"
                    for (let i = 0; i < 5; i++) {
                        ctx.fillRect(px - 24 + i * 11, py - 19, 7, 8)
                    }
                    // banner
                    ctx.fillStyle = "#8a2e2e"
                    ctx.fillRect(px - 4, py - 10, 8, 16)
                    ctx.fillStyle = "#f2c744"
                    ctx.beginPath()
                    ctx.arc(px, py - 4, 2.5, 0, Math.PI * 2)
                    ctx.fill()
                    // crossed swords over door
                    ctx.strokeStyle = "#b8b2a4"
                    ctx.lineWidth = 2.5
                    ctx.beginPath()
                    ctx.moveTo(px - 16, py + 2)
                    ctx.lineTo(px - 8, py + 12)
                    ctx.moveTo(px - 8, py + 2)

                    ctx.stroke()

                }
                    
                case TYPE.MILL: {

                    // roof cap

                    ctx.beginPath()
                    ctx.moveTo(px - 18, py - 14)
                    ctx.lineTo(px, py - 30)
                    ctx.lineTo(px + 18, py - 14)
                    ctx.closePath()
                    ctx.fill()
                    // rotating blades!
                    const angle = tick * 0.04
                    ctx.save()
                    ctx.translate(px, py - 18)
                    ctx.rotate(angle)
                    ctx.fillStyle = "#e8dcc0"
                    ctx.strokeStyle = "#5d4028"
                    ctx.lineWidth = 2
                    for (let i = 0; i < 4; i++) {
                        ctx.rotate(Math.PI / 2)
                        ctx.fillRect(-3, 0, 6, 26)
                        ctx.strokeRect(-3, 0, 6, 26)
                    }
                    ctx.restore()
                    // hub
                    outlinedCircle(px, py - 18, 4, "#5d4028")
                    // door
                    ctx.fillStyle = "#4a3826"
                    ctx.fillRect(px - 5, py + 4, 10, 12)
                    break
                }

        function createParticle(x, y, color, life, vx = 0, vy = 0, size = 4) {
            particles.push({
                x: x,
                y: y,
                vx: vx || rand(-1.5, 1.5),
                vy: vy || rand(-2.5, 0.5),
                life: life,
                maxLife: life,
                color: color,
                size: size
            })
        }
        
        function createFloater(x, y, text, color = "#ffeb9c") {
            floaters.push({
                x: x,
                y: y,
                text: text,
                vy: -1.2,
                life: 55,
                color: color
            })
        }
        
        function triggerRandomEvent() {
            const events = [
                {
                    title: "Bountiful Harvest",
                    desc: "The fields are rich! +40 food",
                    fn: () => {
                        resources.food += 40
                        createFloater(400, 200, "+40 FOOD", "#a3e635")
                    }
                },
                {
                    title: "Goblin Ambush",
                    desc: "A raiding party appears near the border!",
                    fn: () => {
                        const cx = Math.floor(WORLD_WIDTH / 2)
                        const cy = Math.floor(WORLD_HEIGHT / 2)
                        for (let i = 0; i < 6; i++) {
                            const ex = cx + randInt(-35, 35)
                            const ey = cy + randInt(-35, 35)
                            spawnEntity(ex, ey, Math.random() > 0.6 ? TYPE.GOBLIN : TYPE.ORC)
                        }
                        addLog("GOBLIN RAID INCOMING", "#f43f5e")
                    }
                },
                {
                    title: "Traveling Merchant",
                    desc: "A merchant caravan arrives. Trade offered.",
                    fn: () => {
                        resources.gold += 25
                        resources.wood += 15
                        addLog("MERCHANT TRADE COMPLETE", "#eab308")
                    }
                },
                {
                    title: "Miraculous Spring",
                    desc: "A sacred spring was discovered. Morale +18",
                    fn: () => {
                        morale = Math.min(100, morale + 18)
                        addLog("HOLY SPRING FOUND", "#67e8f9")
                    }
                },
                {
                    title: "Plague Outbreak",
                    desc: "Villagers are sick. -12 morale. -20 food",
                    fn: () => {
                        morale = Math.max(10, morale - 12)
                        resources.food = Math.max(0, resources.food - 20)
                        addLog("THE PLAGUE SPREADS", "#a78bfa")
                        
                        // kill some villagers
                        const villagers = getEntitiesOfType(TYPE.VILLAGER)
                        if (villagers.length > 3) {
                            villagers.slice(0, 3).forEach(v => v.dead = true)
                        }
                    }
                },
                {
                    title: "Ancient Relic Found",
                    desc: "An old crown was recovered. +30 research",
                    fn: () => {
                        resources.research += 30
                        addLog("RELIC DISCOVERED", "#c084fc")
                    }
                },
                {
                    title: "Festival of the Sun",
                    desc: "The people celebrate! +25 morale",
                    fn: () => {
                        morale = Math.min(100, morale + 25)
                        resources.food -= 10
                        addLog("THE SUN FESTIVAL!", "#f59e0b")
                    }
                }
            ]
            
            const chosen = events[randInt(0, events.length)]
            addLog(chosen.title.toUpperCase(), "#facc15")
            chosen.fn()
            
            // show floating banner
            showBigMessage(chosen.title, chosen.desc, 2200)
        }
        
        function addLog(text, color = "#a3a3a3") {
            eventLog.unshift({
                text: text,
                color: color,
                tick: tick
            })
            if (eventLog.length > 12) eventLog.pop()
        }
        
        function updateSimulation() {
            if (isPaused || gameOver) return
            
            tick += gameSpeed
            dayOfYear++
            
            if (dayOfYear > 400) {
                dayOfYear = 0
                year++
            }
            
            seasonIndex = Math.floor(dayOfYear / 100) % 4
            
            // update camera slightly if needed
            if (tick % 80 === 0) {
                const centerX = WORLD_WIDTH * TILE_SIZE / 2
                const centerY = WORLD_HEIGHT * TILE_SIZE / 2
                camera.x = centerX - canvas.width / 2 + Math.sin(tick / 200) * 80
                camera.y = centerY - canvas.height / 2 + Math.cos(tick / 300) * 50
            }
            
            // income
            incomeThisTick = { wood: 0, stone: 0, gold: 0, food: 0, research: 0 }
            
            const farms = getEntitiesOfType(TYPE.FARM)
            const lumbers = getEntitiesOfType(TYPE.LUMBER)
            const quarries = getEntitiesOfType(TYPE.QUARRY)
            const taverns = getEntitiesOfType(TYPE.TAVERN)
            const temples = getEntitiesOfType(TYPE.TEMPLE)
            const mills = getEntitiesOfType(TYPE.MILL)
            
            // production
            if (tick % 18 === 0) {
                // farms
                farms.forEach(f => {
                    let amt = 3
                    if (seasonIndex === 0 || seasonIndex === 1) amt = 5 // spring + summer
                    
                    // nearby mills boost
                    const nearbyMill = mills.some(m => distance(m.x, m.y, f.x, f.y) < 6)
                    if (nearbyMill) amt = Math.floor(amt * 1.6)
                    
                    resources.food += amt
                    incomeThisTick.food += amt
                    
                    if (Math.random() < 0.2) {
                        createParticle(f.x * TILE_SIZE + 20, f.y * TILE_SIZE + 12, "#bef575", 26, 0, -1.5)
                    }
                })
                
                lumbers.forEach(() => {
                    const amt = 3 + (Math.random() > 0.6 ? 2 : 0)
                    resources.wood += amt
                    incomeThisTick.wood += amt
                })
                
                quarries.forEach(q => {
                    resources.stone += 4
                    incomeThisTick.stone += 4
                    
                    if (Math.random() < 0.13) {
                        resources.gold += 1
                        incomeThisTick.gold += 1
                        createFloater(q.x * TILE_SIZE, q.y * TILE_SIZE - 20, "GOLD VEIN!", "#fde047")
                    }
                })
            }
            
            // taverns and temples
            if (tick % 55 === 0) {
                taverns.forEach(() => {
                    resources.gold += 2
                    incomeThisTick.gold += 2
                    morale = Math.min(100, morale + 0.6)
                })
                
                temples.forEach(() => {
                    morale = Math.min(100, morale + 1.2)
                    incomeThisTick.research += 1
                    resources.research += 1
                })
            }
            
            // update villagers
            const villagers = getEntitiesOfType(TYPE.VILLAGER)
            villagers.forEach(v => {
                v.age++
                
                if (v.state === "idle") {
                    if (Math.random() < 0.04) {
                        v.state = "walk"
                        v.targetX = v.x + randInt(-7, 7)
                        v.targetY = v.y + randInt(-7, 7)
                    }
                } else if (v.state === "walk") {
                    const dx = v.targetX - v.x
                    const dy = v.targetY - v.y
                    const len = Math.hypot(dx, dy)
                    
                    if (len > 0.2) {
                        v.x += (dx / len) * 0.07
                        v.y += (dy / len) * 0.07
                    } else {
                        v.state = "idle"
                    }
                }
                
                // villagers eat food
                if (tick % 220 === 0 && resources.food > 4) {
                    resources.food -= 1
                }
            })
            
            // combat update
            updateCombat()
            
            // random events
            if (tick - lastRandomEvent > 520 + randInt(0, 700)) {
                lastRandomEvent = tick
                if (Math.random() < 0.7) triggerRandomEvent()
            }
            
            // weather cycle
            weatherTimer--
            if (weatherTimer <= 0) {
                const weathers = ["clear", "rain", "snow"]
                weather = weathers[randInt(0, weathers.length)]
                weatherTimer = randInt(280, 1100)
                
                if (weather === "rain") addLog("IT BEGINS TO RAIN", "#22d3ee")
                if (weather === "snow") addLog("SNOW FALLS OVER THE LAND", "#e0f2fe")
            }
            
            // morale decay / growth
            if (tick % 45 === 0) {
                let moraleDelta = 0
                
                // buildings influence
                moraleDelta += getEntitiesOfType(TYPE.TAVERN).length * 0.6
                moraleDelta += getEntitiesOfType(TYPE.TEMPLE).length * 1.4
                moraleDelta -= getEntitiesOfType(TYPE.GOBLIN).length * 2
                
                // population pressure
                if (villagers.length > 35) moraleDelta -= 0.4
                
                morale = Math.max(8, Math.min(100, morale + moraleDelta))
            }
            
            // update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]
                p.x += p.vx
                p.y += p.vy
                p.vy += 0.1 // gravity for some
                p.life--
                if (p.life <= 0) particles.splice(i, 1)
            }
            
            // update floaters
            for (let i = floaters.length - 1; i >= 0; i--) {
                const f = floaters[i]
                f.y += f.vy
                f.life--
                if (f.life <= 0) floaters.splice(i, 1)
            }
            
            // clean dead
            entities = entities.filter(e => !e.dead)
            
            // win condition
            if (year >= 12 && morale > 80 && !victory) {
                victory = true
                showBigMessage("YOUR KINGDOM ENDURES", "A LEGEND WAS BORN", 8000)
            }
            
            // lose condition
            if (morale < 12 && tick > 800) {
                gameOver = true
                showBigMessage("THE REALM FELL", "MORALE COLLAPSED", 5000)
            }
            
            updateMinimap()
        }
        
        function updateCombat() {
            const enemies = entities.filter(e => e.isEnemy() && !e.dead)
            const defenders = entities.filter(e => (e.type === TYPE.GUARD || e.type === TYPE.KNIGHT || e.type === TYPE.ARCHER || e.type === TYPE.TOWER) && !e.dead)
            
            enemies.forEach(enemy => {
                // find target
                let target = null
                let bestDist = Infinity
                
                defenders.forEach(def => {
                    const d = distance(enemy.x, enemy.y, def.x, def.y)
                    if (d < bestDist) {
                        bestDist = d
                        target = def
                    }
                })
                
                if (!target) {
                    // go for keep
                    const keep = getEntitiesOfType(TYPE.KEEP)[0]
                    if (keep) target = keep
                }
                
                if (!target) return
                
                const dx = target.x - enemy.x
                const dy = target.y - enemy.y
                const distToTarget = Math.hypot(dx, dy)
                
                if (distToTarget > 1.8) {
                    enemy.x += Math.sign(dx) * 0.065
                    enemy.y += Math.sign(dy) * 0.065
                } else {
                    // attack
                    if (tick % 13 === 0) {
                        target.hp -= enemy.type === TYPE.TROLL ? 32 : 13
                        createParticle(target.x * TILE_SIZE + rand(-10, 10), target.y * TILE_SIZE - 10, "#f43f5e", 18, rand(-3, 3), rand(-4, -1))
                        
                        if (target.hp <= 0) {
                            target.dead = true
                            if (target.type === TYPE.KEEP) gameOver = true
                        }
                    }
                }
                
                // trap damage simulation
                if (Math.random() < 0.02) {
                    enemy.hp -= 22
                    if (enemy.hp < 0) enemy.dead = true
                }
            })
            
            // defenders attack
            defenders.forEach(def => {
                let closestEnemy = null
                let record = Infinity
                
                enemies.forEach(en => {
                    const d = distance(def.x, def.y, en.x, en.y)
                    if (d < record) {
                        record = d
                        closestEnemy = en
                    }
                })
                
                if (!closestEnemy || record > 7) return
                
                if (tick % (def.type === TYPE.ARCHER ? 22 : 14) === 0) {
                    closestEnemy.hp -= def.type === TYPE.KNIGHT ? 34 : 18
                    
                    createParticle(
                        closestEnemy.x * TILE_SIZE + 12, 
                        closestEnemy.y * TILE_SIZE - 18, 
                        "#fde047", 22, rand(-1, 4), -3
                    )
                    
                    if (closestEnemy.hp <= 0) {
                        closestEnemy.dead = true
                        createFloater(closestEnemy.x * TILE_SIZE, closestEnemy.y * TILE_SIZE, "SLAIN", "#eab308")
                    }
                }
            })
        }
        
        function drawWorld() {
            ctx.save()
            ctx.translate(-camera.x, -camera.y)
            
            const startX = Math.floor(camera.x / TILE_SIZE) - 1
            const startY = Math.floor(camera.y / TILE_SIZE) - 1
            const endX = Math.floor((camera.x + canvas.width) / TILE_SIZE) + 3
            const endY = Math.floor((camera.y + canvas.height) / TILE_SIZE) + 3
            
            for (let x = Math.max(0, startX); x < Math.min(WORLD_WIDTH, endX); x++) {
                for (let y = Math.max(0, startY); y < Math.min(WORLD_HEIGHT, endY); y++) {
                    if (!explored[x][y]) {
                        ctx.fillStyle = "#111111"
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE)
                        continue
                    }
                    
                    drawTerrain(x, y, world[x][y])
                }
            }
            
            // sort entities by Y for pseudo-depth
            const sortedEntities = [...entities].sort((a, b) => a.y - b.y)
            
            sortedEntities.forEach(entity => {
                if (explored[Math.floor(entity.x)] && explored[Math.floor(entity.x)][Math.floor(entity.y)]) {
                    drawEntity(entity)
                }
            })
            
            // particles
            particles.forEach(p => {
                const alpha = p.life / p.maxLife
                ctx.globalAlpha = alpha * 0.9
                ctx.fillStyle = p.color
                ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size * 0.6)
            })
            ctx.globalAlpha = 1
            
            // floaters
            ctx.textAlign = "center"
            ctx.font = "600 13px monospace"
            floaters.forEach(f => {
                const alpha = Math.max(0, f.life / 44)
                ctx.globalAlpha = alpha
                ctx.fillStyle = f.color
                ctx.fillText(f.text, f.x - camera.x, f.y - camera.y)
            })
            ctx.globalAlpha = 1
            ctx.textAlign = "left"
            
            ctx.restore()
        }
        
        function updateMinimap() {
            if (!minimapCtx) return
            
            minimapCtx.fillStyle = "#052e16"
            minimapCtx.fillRect(0, 0, 140, 140)
            
            const scale = 140 / WORLD_WIDTH
            
            // draw explored terrain in miniature
            for (let x = 0; x < WORLD_WIDTH; x += 6) {
                for (let y = 0; y < WORLD_HEIGHT; y += 6) {
                    if (!explored[x] || !explored[x][y]) continue
                    
                    const terrain = world[x][y].terrain
                    
                    if (terrain === "water") minimapCtx.fillStyle = "#0c4a6e"
                    else if (terrain === "forest") minimapCtx.fillStyle = "#166534"
                    else minimapCtx.fillStyle = "#365314"
                    
                    minimapCtx.fillRect(x * scale, y * scale, 5, 5)
                }
            }
            
            // entities dots
            entities.forEach(e => {
                if (e.dead) return
                let color = "#eab308"
                if (e.isEnemy()) color = "#e11d48"
                if (e.type === TYPE.KEEP) color = "#854d0e"
                
                minimapCtx.fillStyle = color
                minimapCtx.fillRect(e.x * scale - 1, e.y * scale - 1, 3, 3)
            })
            
            // camera viewport
            const camX = (camera.x / (WORLD_WIDTH * TILE_SIZE)) * 140
            const camY = (camera.y / (WORLD_HEIGHT * TILE_SIZE)) * 140
            const camW = (canvas.width / (WORLD_WIDTH * TILE_SIZE)) * 140
            const camH = (canvas.height / (WORLD_HEIGHT * TILE_SIZE)) * 140
            
            minimapCtx.strokeStyle = "#fcd34d"
            minimapCtx.lineWidth = 2
            minimapCtx.strokeRect(camX, camY, camW, camH)
        }

            document.getElementById("stone-income").innerHTML = incomeThisTick.stone > 0 ? `+${incomeThisTick.stone}` : ""
            document.getElementById("gold-income").innerHTML = incomeThisTick.gold > 0 ? `+${incomeThisTick.gold}` : ""

        function researchTech(id) {
            const tech = techs.find(t => t.id === id)
            if (!tech || unlockedTechs.has(id)) return
            if (resources.research < tech.cost) {
                createFloater(300, 200, "NOT ENOUGH RESEARCH", "#f87171")
                return
            }
            
            resources.research -= tech.cost
            unlockedTechs.add(id)
            
            // apply permanent effects
            if (id === "irrigation") {
                addLog("IRRIGATION UNLOCKED — FARMS BUFFED", "#4ade80")
            }
            if (id === "scholarship") {
                addLog("KNOWLEDGE FLOWS", "#67e8f9")
            }
            
            createFloater(340, 160, "TECH ACQUIRED!", "#67e8f9")
            renderUI()
        }
        
        function drawNewCard() {
            if (availableCards.length === 0) {
                availableCards = [...CARD_DECK]
            }
            
            const idx = randInt(0, availableCards.length)
            currentCard = availableCards[idx]
            availableCards.splice(idx, 1)
            
            // occasionally give a free unit card
            if (Math.random() < 0.2 && currentCard.unit !== true) {
                currentCard = CARD_DECK.find(c => c.unit) || currentCard
            }
            
            renderUI()
        }
        
        function canAfford(card) {
            if (!card || !card.cost) return false
            if (card.cost.wood && resources.wood < card.cost.wood) return false
            if (card.cost.stone && resources.stone < card.cost.stone) return false
            if (card.cost.gold && resources.gold < card.cost.gold) return false
            if (card.cost.food && resources.food < card.cost.food) return false
            return true
        }
        
        function payForCard(card) {
            if (card.cost.wood) resources.wood -= card.cost.wood
            if (card.cost.stone) resources.stone -= card.cost.stone
            if (card.cost.gold) resources.gold -= card.cost.gold
            if (card.cost.food) resources.food -= card.cost.food
        }
        
        function findNearestBuildableTile(centerX, centerY) {
            for (let radius = 0; radius <= 12; radius++) {
                for (let offsetX = -radius; offsetX <= radius; offsetX++) {
                    for (let offsetY = -radius; offsetY <= radius; offsetY++) {
                        if (Math.abs(offsetX) !== radius && Math.abs(offsetY) !== radius) continue

                        const tx = centerX + offsetX
                        const ty = centerY + offsetY
                        const tile = world[tx] && world[tx][ty]

                        if (!tile || tile.terrain === "water" || buildingAt(tx, ty)) continue
                        return { tx, ty }
                    }
                }
            }
            return null
        }

        function placeCurrentCard(targetX, targetY) {
            if (!currentCard || gameOver) return

            const fallbackX = Math.floor((camera.x + canvas.width / 2) / TILE_SIZE)
            const fallbackY = Math.floor((camera.y + canvas.height / 2) / TILE_SIZE)
            const requestedTile = Number.isInteger(targetX) && Number.isInteger(targetY)
                ? { tx: targetX, ty: targetY }
                : findNearestBuildableTile(fallbackX, fallbackY)

            if (!requestedTile) {
                createFloater(fallbackX * TILE_SIZE, fallbackY * TILE_SIZE, "NO SPACE NEARBY", "#f59e0b")
                return
            }

            const { tx, ty } = requestedTile
            const tile = world[tx] && world[tx][ty]

            if (!tile || tile.terrain === "water") {
                createFloater(tx * TILE_SIZE + TILE_SIZE / 2, ty * TILE_SIZE, "CANNOT BUILD HERE", "#f59e0b")
                return
            }

            if (buildingAt(tx, ty)) {
                createFloater(tx * TILE_SIZE + TILE_SIZE / 2, ty * TILE_SIZE, "SPACE OCCUPIED", "#f59e0b")
                return
            }

            if (!canAfford(currentCard)) {
                createFloater(tx * TILE_SIZE + TILE_SIZE / 2, ty * TILE_SIZE, "CANNOT AFFORD", "#f43f5e")
                return
            }

            payForCard(currentCard)
            spawnEntity(tx, ty, currentCard.type)

            // Cottages bring new residents into the simulation.
            if (currentCard.type === TYPE.HOUSE) {
                for (let k = 0; k < 3; k++) {
                    const v = spawnEntity(tx + randInt(-2, 2), ty + randInt(-2, 2), TYPE.VILLAGER)
                    v.home = { x: tx, y: ty }
                }
            }

            for (let k = 0; k < 18; k++) {
                createParticle(
                    tx * TILE_SIZE + rand(0, TILE_SIZE),
                    ty * TILE_SIZE + rand(0, TILE_SIZE),
                    "#fde047", 32, rand(-2.5, 2.5), rand(-4, -0.6), 5
                )
            }

            createFloater(tx * TILE_SIZE + TILE_SIZE / 2, ty * TILE_SIZE + 10, "BUILT!", "#a3e635")
            revealArea(tx, ty, 9)
            drawNewCard()
            
            renderUI()
        }
        
        function skipCard() {
            if (resources.gold < 3) {
                createFloater(280, 180, "NEED 3 GOLD", "#fda4af")
                return
            }
            resources.gold -= 3
            drawNewCard()
            createFloater(280, 180, "CARD SKIPPED", "#a5b4fc")
        }
        
        function clickOnCanvas(e) {
            if (gameOver || isPaused) return
            
            const rect = canvas.getBoundingClientRect()
            const mx = e.clientX - rect.left
            const my = e.clientY - rect.top
            
            const worldX = (mx + camera.x) / TILE_SIZE
            const worldY = (my + camera.y) / TILE_SIZE
            
            const tx = Math.floor(worldX)
            const ty = Math.floor(worldY)
            
            if (tx < 0 || ty < 0 || tx >= WORLD_WIDTH || ty >= WORLD_HEIGHT) return
            
            // Use a small radius so clicking an enemy sprite is reliable.
            const clickedEntity = entities.find(ent => {
                return !ent.dead && ent.isEnemy() && distance(ent.x, ent.y, worldX, worldY) < 0.8
            })
            
            if (clickedEntity && clickedEntity.isEnemy()) {
                clickedEntity.hp -= 60
                createParticle(clickedEntity.x * TILE_SIZE + 24, clickedEntity.y * TILE_SIZE + 12, "#ec4899", 30)
                if (clickedEntity.hp < 0) clickedEntity.dead = true
                return
            }
            
            // Buildings and units are placed on the exact tile that was clicked.
            if (currentCard) {
                placeCurrentCard(tx, ty)
            }
        }
        
        function showBigMessage(title, subtitle, timeout = 1800) {
            const overlay = document.getElementById("big-message")
            document.getElementById("big-title").innerHTML = title
            document.getElementById("big-subtitle").innerHTML = subtitle
            overlay.classList.remove("hidden")
            overlay.style.opacity = 1
            
            setTimeout(() => {
                overlay.style.opacity = 0
                setTimeout(() => {
                    if (!overlay.classList.contains("hidden")) overlay.classList.add("hidden")
                }, 800)
            }, timeout)
        }
        
        function setSpeed(n) {
            gameSpeed = n
            document.querySelectorAll(".speed-btn").forEach(el => {
                if (parseFloat(el.textContent) === n) {
                    el.classList.add("bg-amber-400", "text-black")
                } else {
                    el.classList.remove("bg-amber-400", "text-black")
                }
            })
        }
        
        function togglePause() {
            isPaused = !isPaused
            const pauseBtn = document.getElementById("pause-btn")
            pauseBtn.style.backgroundColor = isPaused ? "#450a0a" : ""
            document.getElementById("pause-text").textContent = isPaused ? "PLAY" : "PAUSE"
        }
        
        function switchTab(n) {
            selectedTab = n
            document.querySelectorAll(".tab-button").forEach((el, i) => {
                if (i === n) {
                    el.classList.add("border-b-2", "border-amber-400", "text-amber-400")
                } else {
                    el.classList.remove("border-b-2", "border-amber-400", "text-amber-400")
                }
            })
            renderUI()
        }
        
        function showHelp() {
            showBigMessage(
                "HOW TO PLAY", 
                `• Click the CARD to place buildings<br>
                 • Drag the map to explore<br>
                 • Survive raids and keep morale high<br>
                 • Research technologies to improve your kingdom<br><br>
                 <span class="text-amber-400">Build. Protect. Prosper.</span>`, 
                6500
            )
        }
        
        function dismissHint() {
            document.getElementById("hint-box").classList.add("hidden")
        }
        
        function gameLoop(timestamp) {
            if (lastFrameTime === 0) lastFrameTime = timestamp
            const deltaTime = timestamp - lastFrameTime
            lastFrameTime = timestamp
            
            if (!isPaused && !gameOver && !victory) {
                tickAccumulator += deltaTime * gameSpeed
                while (tickAccumulator >= BASE_TICK_INTERVAL) {
                    tickAccumulator -= BASE_TICK_INTERVAL
                    updateSimulation()
                }
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height)
            ctx.fillStyle = "#0a120a"
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            drawWorld()
            renderUI()
            
            // subtle vignette
            const grad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.6,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.9
            )
            grad.addColorStop(0, "transparent")
            grad.addColorStop(1, "rgba(9, 13, 9, 0.6)")
            ctx.fillStyle = grad
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            requestAnimationFrame(gameLoop)
        }
        
        function resize() {
            canvas.width = window.innerWidth - 290 // leave space for sidebar
            canvas.height = window.innerHeight - 56
        }
        
        function init() {
            canvas = document.getElementById("canvas")
            ctx = canvas.getContext("2d", { alpha: true })
            
            minimapCanvas = document.getElementById("minimap")
            minimapCtx = minimapCanvas.getContext("2d")
            
            resize()
            window.addEventListener("resize", resize)
            
            // Tailwind script run
            function initTailwind() {
                // already loaded via CDN
            }
            initTailwind()
            
            initWorld()
            initStartingKingdom()
            initTechTree()
            
            // start camera in middle
            camera.x = (WORLD_WIDTH * TILE_SIZE / 2) - canvas.width / 2 + 120
            camera.y = (WORLD_HEIGHT * TILE_SIZE / 2) - canvas.height / 2 - 80
            
            // initial card
            drawNewCard()
            
            // initial log entries
            addLog("KINGDOM FOUNDED", "#67e8f9")
            addLog("WELCOME TO ELDRIA", "#facc15")
            addLog("DRAW YOUR FIRST CARD", "#a3a3a3")
            
            // mouse controls
            let isDragging = false
            let pointerMoved = false
            let lastMouseX = 0
            let lastMouseY = 0
            let pointerStartX = 0
            let pointerStartY = 0
            
            canvas.addEventListener("mousedown", e => {
                if (e.button === 0) {
                    isDragging = true
                    pointerMoved = false
                    lastMouseX = e.clientX
                    lastMouseY = e.clientY
                    pointerStartX = e.clientX
                    pointerStartY = e.clientY
                }
            })
            
            window.addEventListener("mouseup", e => {
                if (isDragging && !pointerMoved && e.button === 0) {
                    // A short press is a world interaction; movement remains map panning.
                    clickOnCanvas(e)
                }
                isDragging = false
            })
            
            canvas.addEventListener("mousemove", e => {
                if (!isDragging) return
                
                const dx = e.clientX - lastMouseX
                const dy = e.clientY - lastMouseY

                if (Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY) > 6) {
                    pointerMoved = true
                }
                
                camera.x -= dx * 1.6
                camera.y -= dy * 1.6
                
                // clamp camera
                camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH * TILE_SIZE - canvas.width))
                camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT * TILE_SIZE - canvas.height))
                
                lastMouseX = e.clientX
                lastMouseY = e.clientY
            })
            
            // right click context menu disable
            canvas.addEventListener("contextmenu", e => {
                e.preventDefault()
                clickOnCanvas(e)
            })
            
            // keyboard
            window.addEventListener("keydown", e => {
                if (e.key === "/" && document.getElementById("big-message").classList.contains("hidden")) {
                    showHelp()
                    e.preventDefault()
                }
                
                if (e.metaKey && e.key === "k") {
                    togglePause()
                    e.preventDefault()
                }
            })
            
            // demo enemy raid after some time
            setTimeout(() => {
                if (!gameOver) {
                    const cx = Math.floor(WORLD_WIDTH / 2) + 30
                    const cy = Math.floor(WORLD_HEIGHT / 2) + 22
                    for (let i = 0; i < 7; i++) {
                        spawnEntity(cx + randInt(-4, 8), cy + randInt(-6, 6), TYPE.GOBLIN)
                    }
                    totalRaidsSurvived++
                    addLog("FIRST RAID DETECTED", "#e11d48")
                }
            }, 6200)
            
            // demo hint
            setTimeout(() => {
                const hint = document.getElementById("hint-box")
                document.getElementById("hint-text").innerHTML = `Click anywhere on the map while holding a card to place buildings.<br><br>Drag to explore the wilderness.`
                hint.classList.remove("hidden")
            }, 2100)
            
            // kick off loop
            requestAnimationFrame(gameLoop)
            
            // show welcome
            setTimeout(() => {
                showBigMessage("CASTLEFORGE", "A KINGDOM SIMULATION<br><span class='text-xs text-amber-400'>CLICK THE CARD TO BUILD • DRAG TO PAN</span>", 2100)
            }, 420)
            
            // kingdom name randomizer
            const names = ["ELDRIA", "VALKOR", "THORNWALL", "SILVERHOLD", "DUSKREACH", "AETHERFELL"]
            kingdomName = names[randInt(0, names.length)]
            document.getElementById("kingdom-name").textContent = "THE REALM OF " + kingdomName
        }
        
        window.onload = init
    </script>
</body>
</html>
