<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Kings and Cards — illustrated fantasy realm</title>
<desc id="desc">A colorful storybook kingdom with a crowned castle, village, river, forest, windmill and distant mountains.</desc>
