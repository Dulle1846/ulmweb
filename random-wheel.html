<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Wheel of Names</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for the wheel and arrow, overriding some Tailwind defaults if necessary */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background for contrast */
            color: #e2e8f0; /* Light text color */
        }

        .wheel-container {
            position: relative;
            width: 400px; /* Base size, responsive with Tailwind */
            height: 400px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #4a5568; /* Darker border */
            box-shadow: 0 0 30px rgba(0,0,0,0.5); /* More prominent shadow */
            /* Removed CSS transform here, as rotation is now handled by canvas context */
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            /* Removed CSS transition here, as rotation is now handled by canvas context */
        }

        .spinner-arrow {
            position: absolute;
            top: -25px; /* Position above the wheel */
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid #ef4444; /* Bright red arrow */
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); /* Shadow for the arrow */
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .wheel-container {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-bold mb-8 text-white">Spin the Wheel!</h1>

    <div class="wheel-container mb-8">
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <div class="spinner-arrow"></div>
    </div>

    <div class="flex flex-col gap-4 w-full max-w-md p-6 bg-gray-800 rounded-lg shadow-lg">
        <label for="entriesInput" class="text-lg font-semibold text-gray-200">Enter Names (one per line):</label>
        <textarea id="entriesInput"
                  class="w-full min-h-[150px] p-3 border border-gray-600 rounded-md bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="e.g.,&#10;Alice&#10;Bob&#10;Charlie&#10;David"></textarea>

        <button id="updateWheelButton"
                class="px-6 py-3 bg-blue-600 text-white font-bold rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition duration-200 ease-in-out">
            Update Wheel
        </button>

        <button id="spinButton"
                class="px-6 py-3 bg-green-600 text-white font-bold rounded-md shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition duration-200 ease-in-out">
            Spin Wheel
        </button>
    </div>

    <div id="result" class="mt-8 text-5xl font-extrabold text-yellow-400 text-center drop-shadow-lg"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const entriesInput = document.getElementById('entriesInput');
            const updateWheelButton = document.getElementById('updateWheelButton');
            const spinButton = document.getElementById('spinButton');
            const resultDisplay = document.getElementById('result');

            let entries = [];
            let arc = 0; // Angle for each segment
            const PI = Math.PI;

            // --- Wheel Drawing Function ---
            // This function draws the wheel segments and text, applying the current rotation offset
            function drawWheel(rotationOffset = 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the entire canvas

                if (entries.length === 0) {
                    // Display a message if no entries are present
                    ctx.fillStyle = '#4a5568'; // Dark gray background for empty wheel
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#e2e8f0'; // Light text color
                    ctx.font = '24px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Add names to spin!', canvas.width / 2, canvas.height / 2);
                    return;
                }

                // Calculate the angle for each segment based on the number of entries
                arc = (2 * PI) / entries.length;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) - 10; // Slightly smaller to avoid cutting off at edges

                // Define a set of appealing colors for the wheel segments
                const colors = [
                    '#FFDD57', // Yellow
                    '#3369E8', // Blue
                    '#009925', // Green
                    '#D50F25', // Red
                    '#9C27B0', // Purple
                    '#FF9800', // Orange
                    '#00BCD4', // Cyan
                    '#E91E63'  // Pink
                ];

                ctx.save(); // Save the current state of the context (unrotated)
                ctx.translate(centerX, centerY); // Move the origin to the center of the canvas
                // Apply the overall spin rotation to the drawing context (convert degrees to radians)
                ctx.rotate(rotationOffset * PI / 180);

                for (let i = 0; i < entries.length; i++) {
                    // Calculate start and end angles for the current segment.
                    // Subtracting PI / 2 (90 degrees) makes segment 0 start at the 12 o'clock position.
                    const startAngle = i * arc - PI / 2;
                    const endAngle = (i + 1) * arc - PI / 2;

                    ctx.beginPath();
                    ctx.arc(0, 0, radius, startAngle, endAngle); // Draw arc from the new origin (0,0)
                    ctx.lineTo(0, 0); // Draw line to the center to close the pie slice
                    ctx.closePath();

                    // Assign colors from the predefined array, cycling through them
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.strokeStyle = '#2d3748'; // Dark border for segments
                    ctx.lineWidth = 2;
                    ctx.stroke(); // Draw segment borders

                    // Draw text (name) on the segment
                    ctx.save(); // Save context before rotating for text
                    // Rotate to the middle of the segment for text placement
                    ctx.rotate(startAngle + arc / 2);
                    ctx.textAlign = 'right'; // Align text to the right, away from the center
                    ctx.fillStyle = '#1a202c'; // Dark text color for contrast on light segments
                    ctx.font = 'bold 18px Inter, sans-serif'; // Bold font for readability
                    // Position text along the radius, away from the center (0,0 is now canvas center)
                    ctx.fillText(entries[i], radius - 15, 0);
                    ctx.restore(); // Restore context after text drawing (undo text rotation)
                }

                ctx.restore(); // Restore the original context state (undo overall spin rotation and translation)
            }

            // --- Update Entries Function ---
            function updateEntries() {
                // Get text from textarea, split by new line, trim whitespace, and filter out empty lines
                const text = entriesInput.value.trim();
                entries = text.split('\n').map(entry => entry.trim()).filter(entry => entry !== '');
                drawWheel(); // Redraw the wheel with the updated entries (at 0 rotation)
                resultDisplay.textContent = ''; // Clear any previous result
                spinAngle = 0; // Reset internal angle tracking
            }

            // --- Spinning Animation Logic ---
            let spinAngle = 0; // Current rotation angle of the wheel in degrees
            let spinSpeed = 0; // Current speed of rotation in degrees per frame
            const spinDeceleration = 0.99; // Factor to gradually slow down the wheel (e.g., 0.99 means 1% speed loss per frame)
            let animationFrameId; // To store the ID returned by requestAnimationFrame for cancellation

            function animateSpin() {
                spinAngle += spinSpeed; // Increase angle by current speed
                drawWheel(spinAngle); // Redraw the wheel with the new rotation
                spinSpeed *= spinDeceleration; // Reduce speed for deceleration

                // Stop animation when speed is very low (wheel has almost stopped)
                if (spinSpeed < 0.1) {
                    cancelAnimationFrame(animationFrameId); // Stop the animation loop
                    spinButton.disabled = false; // Re-enable the spin button
                    determineWinner(); // Determine and display the winner
                } else {
                    // Continue the animation if speed is still significant
                    animationFrameId = requestAnimationFrame(animateSpin);
                }
            }

            // --- Spin Wheel Function ---
            function spinWheel() {
                if (entries.length === 0) {
                    // Use a custom message for alerts instead of alert()
                    resultDisplay.textContent = 'Please add names to the wheel first!';
                    resultDisplay.style.color = '#ef4444'; // Red for error message
                    setTimeout(() => { resultDisplay.textContent = ''; resultDisplay.style.color = '#a78bfa'; }, 3000); // Clear after 3 seconds
                    return;
                }

                spinButton.disabled = true; // Disable the spin button during animation

                // Set an initial high speed for a dramatic spin.
                // The random factor makes each spin slightly different.
                spinSpeed = Math.random() * 25 + 40; // Random initial speed between 40 and 65 degrees per frame

                // Start the animation loop
                animationFrameId = requestAnimationFrame(animateSpin);
            }

            // --- Determine Winner Function ---
            function determineWinner() {
                // The wheel has rotated by `spinAngle` degrees clockwise.
                // The pointer is fixed at the top (0 degrees).
                // We need to find which segment is now at the top.
                // Normalize spinAngle to be within 0-360 degrees.
                const normalizedSpinAngle = (spinAngle % 360 + 360) % 360;

                // The `effectivePointerAngle` is the angle on the *original* unrotated wheel
                // that is now positioned directly under the fixed pointer (at 0 degrees/12 o'clock).
                // Since the wheel rotates clockwise, if it rotated `X` degrees, the segment that was
                // originally at `(360 - X)` degrees is now at the top.
                const effectivePointerAngle = (360 - normalizedSpinAngle) % 360;

                // Calculate the size of each segment in degrees
                const segmentAngleSize = 360 / entries.length;

                // Determine the winning index.
                // Since segment 0 starts at 0 degrees (top) and segments are drawn clockwise,
                // we can simply divide the effective pointer angle by the segment size.
                const winningIndex = Math.floor(effectivePointerAngle / segmentAngleSize);

                if (entries[winningIndex]) {
                    resultDisplay.textContent = `Winner: ${entries[winningIndex]}!`;
                    resultDisplay.style.color = '#a78bfa'; // Purple for winner
                    // Optional: You can add logic here to remove the winner from the entries array
                    // For example, to prevent them from being picked again:
                    // entries.splice(winningIndex, 1);
                    // updateEntries(); // Redraw wheel without the winner
                } else {
                    resultDisplay.textContent = 'Error: Could not determine winner.';
                    resultDisplay.style.color = '#ef4444'; // Red for error
                }

                // Reset internal angle tracking and redraw the wheel at 0 degrees for the next spin.
                spinAngle = 0;
                drawWheel(spinAngle);
            }

            // --- Event Listeners ---
            updateWheelButton.addEventListener('click', updateEntries);
            spinButton.addEventListener('click', spinWheel);

            // Initial draw of the wheel when the page loads
            // Populate with some default entries for immediate testing
            entriesInput.value = "Apple\nBanana\nCherry\nDate\nElderberry\nFig\nGrape";
            updateEntries();
        });
    </script>
</body>
</html>
