<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Since (Automatic) - Ulmer's Website</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.5;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            color: #000;
            border: 4px solid #000;
        }
        .header {
            background-color: #000;
            color: #fff;
            padding: 40px;
            text-align: center;
            border-bottom: 4px solid #000;
        }
        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 60vh;
            justify-content: center;
        }
        .clock-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #000;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .since-counter {
            background-color: #000;
            color: #fff;
            padding: 40px 30px;
            border: 3px solid #000;
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .since-item {
            color: #fff;
            font-weight: bold;
            text-align: center;
        }
        .since-number {
            font-size: 2.2rem;
            color: #fff;
        }
        .since-label {
            font-size: 1rem;
            font-weight: normal;
            color: #ccc;
            margin-left: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 40px;
            border-top: 4px solid #000;
            background-color: #000;
            color: #fff;
        }
        .footer p {
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            .since-counter {
                font-size: 1.2rem;
                padding: 20px 15px;
                gap: 10px;
            }
            .since-number {
                font-size: 1.6rem;
            }
            .since-label {
                font-size: 0.9rem;
            }
            .clock-title {
                font-size: 1.2rem;
                padding: 10px;
            }
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="https://dulle1846.github.io/ulmweb/" style="color: #fff; text-decoration: none;">
                <h1>ULMER'S WEBSITE</h1>
            </a>
        </div>
        <div class="content">
            <div class="clock-title">Online Since (Automatic)</div>
            <div class="since-counter" id="sinceCounter">
                <div class="since-item"><span class="since-number" id="years">0</span><span class="since-label">years</span></div>
                <div class="since-item"><span class="since-number" id="months">0</span><span class="since-label">months</span></div>
                <div class="since-item"><span class="since-number" id="weeks">0</span><span class="since-label">weeks</span></div>
                <div class="since-item"><span class="since-number" id="days">0</span><span class="since-label">days</span></div>
                <div class="since-item"><span class="since-number" id="hours">0</span><span class="since-label">hours</span></div>
                <div class="since-item"><span class="since-number" id="minutes">0</span><span class="since-label">minutes</span></div>
                <div class="since-item"><span class="since-number" id="seconds">0</span><span class="since-label">seconds</span></div>
            </div>
        </div>
        <div class="footer">
            <p><a href="ulmweb_directory.html" style="color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">The UlmWeb</a></p>
            <p>Website Status: Active</p>
            <p>Operator: Ulmer • 2025</p>
        </div>
    </div>
    <script>
        // Fixed launch date - when the website actually went online
        // Set to today's date when the website was launched
        const startDate = new Date('2025-07-02T19:38:00Z'); // July 2, 2025 launch time

        function updateSinceCounter() {
            const now = new Date();
            let diff = Math.floor((now - startDate) / 1000); // total seconds

            let years = 0, months = 0, weeks = 0, days = 0, hours = 0, minutes = 0, seconds = 0;

            // Helper to add months/years correctly
            let tempDate = new Date(startDate);

            // Years
            while (true) {
                let next = new Date(tempDate);
                next.setFullYear(next.getFullYear() + 1);
                if (next <= now) {
                    years++;
                    tempDate = next;
                } else {
                    break;
                }
            }
            // Months
            while (true) {
                let next = new Date(tempDate);
                next.setMonth(next.getMonth() + 1);
                if (next <= now) {
                    months++;
                    tempDate = next;
                } else {
                    break;
                }
            }
            // Weeks
            while (true) {
                let next = new Date(tempDate);
                next.setDate(next.getDate() + 7);
                if (next <= now) {
                    weeks++;
                    tempDate = next;
                } else {
                    break;
                }
            }
            // Days
            while (true) {
                let next = new Date(tempDate);
                next.setDate(next.getDate() + 1);
                if (next <= now) {
                    days++;
                    tempDate = next;
                } else {
                    break;
                }
            }

            // Remaining time
            let remaining = (now - tempDate) / 1000; // seconds
            hours = Math.floor(remaining / 3600);
            remaining -= hours * 3600;
            minutes = Math.floor(remaining / 60);
            remaining -= minutes * 60;
            seconds = Math.floor(remaining);

            // Update DOM
            document.getElementById('years').textContent = years;
            document.getElementById('months').textContent = months;
            document.getElementById('weeks').textContent = weeks;
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        updateSinceCounter();
        setInterval(updateSinceCounter, 1000);

        // Track page visit
        fetch('/api/visit', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        }).catch(err => console.log('Visit tracking failed:', err));
    </script>
</body>
</html>
