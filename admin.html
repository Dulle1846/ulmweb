<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
        }

        .login-form {
            display: block;
        }

        .dashboard {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4ecdc4;
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #f56565;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #efe;
            color: #2d5a2d;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
            margin-bottom: 20px;
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-card h3 {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #718096;
            font-size: 14px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        }

        .session-info {
            background: #e6fffa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4ecdc4;
        }

        .session-info h3 {
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .session-info p {
            color: #4a5568;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .admin-actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4a5568;
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Zurück zur Website</a>

        <div class="login-form" id="loginForm">
            <div class="header">
                <h1>System Maintenance</h1>
                <p>Autorisierter Zugang erforderlich</p>
            </div>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <form id="loginFormElement">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="totpCode">2FA Code (optional)</label>
                    <input type="text" id="totpCode" name="totpCode" placeholder="000000" maxlength="6">
                </div>

                <button type="submit" class="btn" id="loginBtn">Anmelden</button>
            </form>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="header">
                <h1>Admin Dashboard</h1>
                <p>Willkommen im Verwaltungsbereich</p>
            </div>

            <div class="session-info">
                <h3>Session Information</h3>
                <p id="sessionUser"></p>
                <p id="sessionTime"></p>
                <p id="sessionExpiry"></p>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <h3 id="visitorCount">-</h3>
                    <p>Besucher</p>
                </div>
                <div class="stat-card">
                    <h3 id="lastUpdate">-</h3>
                    <p>Letzte Aktualisierung</p>
                </div>
            </div>

            <div class="admin-actions">
                <button class="action-btn" onclick="editContent()">Inhalte bearbeiten</button>
                <button class="action-btn" onclick="viewLogs()">Logs anzeigen</button>
                <button class="action-btn" onclick="manageSettings()">Einstellungen</button>
                <button class="action-btn" onclick="createBackup()">Backup erstellen</button>
            </div>

            <button class="btn logout-btn" onclick="logout()">Abmelden</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Laden...</p>
        </div>
    </div>

    <script>
        // Session Management
        let sessionTimer = null;
        let expiryTime = null;

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const dashboard = document.getElementById('dashboard');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Check for existing session on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });

        // Login Form Handler
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totpCode = document.getElementById('totpCode').value; // Auch wenn 2FA aus ist, muss es hier stehen

            showLoading();
            hideMessages();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        totpCode: totpCode // Wird an Backend gesendet, aber dort nur verarbeitet, wenn TOTP_SECRET gesetzt ist
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Anmeldung erfolgreich!');
                    expiryTime = Date.now() + (data.expiresIn * 1000);
                    setTimeout(() => {
                        loadDashboard();
                    }, 1000);
                } else {
                    showError(data.error || 'Anmeldung fehlgeschlagen');
                }
            } catch (error) {
                showError('Netzwerkfehler. Bitte versuchen Sie es erneut.');
            } finally {
                hideLoading();
            }
        });

        // Check existing session
        async function checkSession() {
            try {
                const response = await fetch('/api/admin/dashboard');
                if (response.ok) {
                    const data = await response.json();
                    expiryTime = data.loginTime + (30 * 60 * 1000); // 30 minutes
                    loadDashboard();
                }
            } catch (error) {
                // Session invalid, stay on login form
            }
        }

        // Load Dashboard
        async function loadDashboard() {
            showLoading();

            try {
                const response = await fetch('/api/admin/dashboard');
                const data = await response.json();

                if (response.ok) {
                    // Update session info
                    document.getElementById('sessionUser').textContent = `Benutzer: ${data.user}`;
                    document.getElementById('sessionTime').textContent = `Anmeldung: ${new Date(data.loginTime).toLocaleString('de-DE')}`;

                    // Update stats
                    document.getElementById('visitorCount').textContent = data.stats.visitors;
                    document.getElementById('lastUpdate').textContent = new Date(data.stats.lastUpdate).toLocaleString('de-DE');

                    // Show dashboard
                    loginForm.style.display = 'none';
                    dashboard.style.display = 'block';

                    // Start session timer
                    startSessionTimer();
                } else {
                    showError('Fehler beim Laden des Dashboards');
                    logout();
                }
            } catch (error) {
                showError('Netzwerkfehler beim Laden des Dashboards');
                logout();
            } finally {
                hideLoading();
            }
        }

        // Start session timer
        function startSessionTimer() {
            if (sessionTimer) clearInterval(sessionTimer);

            sessionTimer = setInterval(() => {
                const remaining = expiryTime - Date.now();
                const minutes = Math.floor(remaining / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                if (remaining <= 0) {
                    clearInterval(sessionTimer);
                    showError('Session abgelaufen. Bitte melden Sie sich erneut an.');
                    logout();
                } else {
                    document.getElementById('sessionExpiry').textContent = `Session läuft ab in: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Logout
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                // Ignore errors on logout
            }

            if (sessionTimer) clearInterval(sessionTimer);
            expiryTime = null;

            loginForm.style.display = 'block';
            dashboard.style.display = 'none';

            // Clear form
            document.getElementById('loginFormElement').reset();
            hideMessages();
        }

        // Admin Actions (placeholders)
        function editContent() {
            alert('Content-Editor wird hier implementiert');
        }

        function viewLogs() {
            alert('Log-Viewer wird hier implementiert');
        }

        function manageSettings() {
            alert('Einstellungen werden hier implementiert');
        }

        function createBackup() {
            alert('Backup-Funktion wird hier implementiert');
        }

        // Utility Functions
        function showLoading() {
            loading.style.display = 'block';
            loginBtn.disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            loginBtn.disabled = false;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Auto-logout on page visibility change (security)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && dashboard.style.display === 'block') {
                // Optional: logout when tab becomes hidden
                // logout();
            }
        });

        // Prevent right-click context menu in production
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
