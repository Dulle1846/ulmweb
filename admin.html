<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles - Black Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* Solid black background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* Container Styles - White Background, Black Border, No Shadow */
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: none; /* Removed box-shadow */
            border: 2px solid #000; /* Black border */
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        /* Removed the colorful top border */
        .container::before {
            content: none;
        }

        .login-form {
            display: block;
        }

        .dashboard {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333; /* Darker text for labels */
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ccc; /* Light grey border */
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #f8f8f8; /* Light grey background */
            color: #000; /* Black text */
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #000; /* Black border on focus */
            background: white;
        }

        /* Button Styles - Black Background, White Text, No Gradient */
        .btn {
            width: 100%;
            padding: 14px;
            background: #000; /* Solid black background */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); /* Black shadow on hover */
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.4; /* Slightly lighter opacity for disabled */
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            background: #555; /* Grey when disabled */
            border-color: #444;
        }

        /* Error Message Styles - White Background, Black Text, Grey Border */
        .error {
            background: #fff;
            color: #d32f2f; /* Retain a subtle red for error */
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d32f2f; /* Subtle red border */
            margin-bottom: 20px;
            display: none;
        }

        /* Success Message Styles - White Background, Black Text, Green Border */
        .success {
            background: #fff;
            color: #388e3c; /* Retain a subtle green for success */
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #388e3c; /* Subtle green border */
            margin-bottom: 20px;
            display: none;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #000; /* Black text */
            margin-bottom: 8px;
        }

        .header p {
            color: #555; /* Dark grey text */
            font-size: 14px;
        }

        /* Stats and Session Info (will be removed from HTML, but keeping styles for reference) */
        .stats, .session-info {
            display: none; /* Ensure they are hidden if accidentally present */
        }

        /* Logout Button - Black Background, White Text */
        .logout-btn {
            background: #000; /* Solid black */
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); /* Black shadow */
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000; /* Black spinner top */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Admin Actions (will be removed from HTML, but keeping styles for reference) */
        .admin-actions {
            display: none; /* Ensure they are hidden if accidentally present */
        }

        /* New button style for NS API Documentation and Citizen Checker */
        .ns-api-btn {
            background: #000; /* Black background */
            color: white;
            border: 2px solid #fff; /* White border for contrast */
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            margin-bottom: 10px; /* Space between buttons */
            display: block; /* Make it a block element to take full width */
            text-align: center; /* Center the text */
            text-decoration: none; /* Remove underline for link */
        }

        .ns-api-btn:hover {
            background: #333; /* Darker grey on hover */
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }


        /* Back Link */
        .back-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #555; /* Dark grey */
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #000; /* Black on hover */
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Website</a>

        <!-- Login Form -->
        <div class="login-form" id="loginForm">
            <div class="header">
                <h1>System Maintenance</h1>
                <p>Authorized Access Required</p>
            </div>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <form id="loginFormElement">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn" id="loginBtn">Log In</button>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="header">
                <h1>Admin Dashboard</h1>
                <p>Welcome to the administration area</p>
            </div>

            <!-- New button for NS API Documentation -->
            <a href="ns-api-documentation.html" class="ns-api-btn">NS API Documentation</a>
            
            <!-- New button for Citizen Registry Checker -->
            <a href="citreg-checker.html" class="ns-api-btn">Citizen Registry Checker</a>

            <button class="btn logout-btn" onclick="logout()">Log Out</button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script>
        // Session Management
        let sessionTimer = null;
        let expiryTime = null;

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const dashboard = document.getElementById('dashboard');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Check for existing session on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });

        // Login Form Handler
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            showLoading();
            hideMessages();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Login successful!');
                    expiryTime = Date.now() + (data.expiresIn * 1000);
                    setTimeout(() => {
                        loadDashboard();
                    }, 1000);
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                hideLoading();
            }
        });

        // Check existing session
        async function checkSession() {
            try {
                const response = await fetch('/api/admin/dashboard');
                if (response.ok) {
                    const data = await response.json();
                    expiryTime = data.loginTime + (30 * 60 * 1000); // 30 minutes
                    loadDashboard();
                }
            } catch (error) {
                // Session invalid, stay on login form
            }
        }

        // Load Dashboard
        async function loadDashboard() {
            showLoading();

            try {
                const response = await fetch('/api/admin/dashboard');
                const data = await response.json();

                if (response.ok) {
                    // No longer updating session info or stats as elements are removed
                    
                    // Show dashboard
                    loginForm.style.display = 'none';
                    dashboard.style.display = 'block';

                    // Start session timer
                    startSessionTimer();
                } else {
                    showError('Error loading dashboard');
                    logout();
                }
            } catch (error) {
                showError('Network error loading dashboard');
                logout();
            } finally {
                hideLoading();
            }
        }

        // Start session timer
        function startSessionTimer() {
            if (sessionTimer) clearInterval(sessionTimer);

            sessionTimer = setInterval(() => {
                const remaining = expiryTime - Date.now();
                const minutes = Math.floor(remaining / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                if (remaining <= 0) {
                    clearInterval(sessionTimer);
                    showError('Session expired. Please log in again.');
                    logout();
                } else {
                    // Update the session expiry text, even if other session info is removed
                    // You might want to remove this line if you want no session expiry display at all
                    // document.getElementById('sessionExpiry').textContent = `Session expires in: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Logout
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                // Ignore errors on logout
            }

            if (sessionTimer) clearInterval(sessionTimer);
            expiryTime = null;

            loginForm.style.display = 'block';
            dashboard.style.display = 'none';

            // Clear form
            document.getElementById('loginFormElement').reset();
            hideMessages();
        }

        // Utility Functions
        function showLoading() {
            loading.style.display = 'block';
            loginBtn.disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            loginBtn.disabled = false;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Auto-logout on page visibility change (security)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
