        // Ewige Tabelle berechnen
        function berechneEwigeTabelle() {
            const ewigeStats = {};
            
            saisonDaten.forEach(saison => {
                Object.entries(saison).forEach(([team, stats]) => {
                    if (!ewigeStats[team]) {
                        ewigeStats[team] = {
                            saisons: 0,
                            spiele: 0,
                            siege: 0,
                            unentschieden: 0,
                            niederlagen: 0,
                            tore: 0,
                            gegentore: 0,
                            punkte: 0
                        };
                    }
                    
                    ewigeStats[team].saisons++;
                    ewigeStats[team].spiele += stats.spiele;
                    ewigeStats[team].siege += stats.siege;
                    ewigeStats[team].unentschieden += stats.unent;
                    ewigeStats[team].niederlagen += stats.nied;
                    ewigeStats[team].tore += stats.tore;
                    ewigeStats[team].gegentore += stats.gegen;
                    ewigeStats[team].punkte += stats.punkte;
                });
            });
            
            // Nach Punkten sortieren
            const sortierteTeams = Object.entries(ewigeStats).sort((a, b) => {
                if (b[1].punkte !== a[1].punkte) return b[1].punkte - a[1].punkte;
                if ((b[1].tore - b[1].gegentore) !== (a[1].tore - a[1].gegentore)) {
                    return (b[1].tore - b[1].gegentore) - (a[1].tore - a[1].gegentore);
                }
                return b[1].tore - a[1].tore;
            });
            
            return sortierteTeams;
        }

        // Tabelle rendern
        function renderTabelle() {
            const ewigeTabelle = berechneEwigeTabelle();
            const tbody = document.getElementById('tabellenBody');
            
            tbody.innerHTML = '';
            
            ewigeTabelle.forEach(([team, stats], index) => {
                const tordifferenz = stats.tore - stats.gegentore;
                const avgPunkte = (stats.punkte / stats.saisons).toFixed(1);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank">${index + 1}</td>
                    <td class="team-name">${team}</td>
                    <td>${stats.saisons}</td>
                    <td>${stats.spiele}</td>
                    <td>${stats.siege}</td>
                    <td>${stats.unentschieden}</td>
                    <td>${stats.niederlagen}</td>
                    <td>${stats.tore}</td>
                    <td>${stats.gegentore}</td>
                    <td class="${tordifferenz >= 0 ? 'positive' : 'negative'}">${tordifferenz >= 0 ? '+' : ''}${tordifferenz}</td>
                    <td class="points">${stats.punkte}</td>
                    <td>${avgPunkte}</td>
                `;
                tbody.appendChild(row);
            });
            
            // Statistiken aktualisieren
            updateStats(ewigeTabelle);
        }

        function updateStats(tabelle) {
            const totalTeams = tabelle.length;
            const totalSeasons = saisonDaten.length;
            const totalGames = tabelle.reduce((sum, [, stats]) => sum + stats.spiele, 0);
            const totalGoals = tabelle.reduce((sum, [, stats]) => sum + stats.tore, 0);
            
            document.getElementById('totalSeasons').textContent = totalSeasons;
            document.getElementById('totalTeams').textContent = totalTeams;
            document.getElementById('totalGames').textContent = totalGames.toLocaleString();
            document.getElementById('totalGoals').textContent = totalGoals.toLocaleString();
        }
