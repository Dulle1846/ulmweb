<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background */
            color: #e2e8f0; /* Light text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #2d3748; /* Slightly lighter dark for container */
            border-radius: 1rem; /* Rounded corners */
            padding: 2.5rem;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .header {
            font-size: 2.8rem;
            font-weight: 700;
            color: #63b3ed; /* Blue header */
            margin-bottom: 1rem;
        }
        .description {
            font-size: 1.1rem;
            color: #cbd5e0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for mobile */
            gap: 1rem;
        }
        @media (min-width: 640px) { /* Two columns for larger screens */
            .nav-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 1.5rem;
            background-color: #4a5568; /* Slightly lighter button background */
            color: white;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #63b3ed; /* Blue border for emphasis */
        }
        .nav-button:hover {
            background-color: #63b3ed; /* Blue on hover */
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .nav-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .nav-button span {
            margin-right: 0.75rem; /* Space for icon */
        }
        /* Basic icon styling (using emojis for simplicity) */
        .icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">Lionsroarian Football Association Hub</h1>
        <p class="description">
            Welcome to the central hub for your fictional football league! From here, you can manage seasons, simulate matches, view league standings, and explore club details.
        </p>

        <div class="nav-grid">
            <a href="game-engine.html" class="nav-button">
                <span class="icon">⚽</span> Match Simulator
            </a>
            <a href="league-table.html" class="nav-button">
                <span class="icon">🏆</span> League Table
            </a>
            <a href="clubs.html" class="nav-button">
                <span class="icon">🏟️</span> Clubs
            </a>
            <a href="settings.html" class="nav-button">
                <span class="icon">⚙️</span> Settings
            </a>
            <a href="history.html" class="nav-button">
                <span class="icon">📜</span> History
            </a>
            <a href="storage.html" class="nav-button">
                <span class="icon">🗄️</span> Storage
            </a>
        </div>
    </div>
</body>
</html>
