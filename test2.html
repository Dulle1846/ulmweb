<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fantasy Tavern</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background-color: #1e1a14;
      color: #fff;
      overflow: hidden;
    }

    .tavern {
      width: 100vw;
      height: 100vh;
      background: url('https://i.imgur.com/DsBKVBI.jpg') center/cover no-repeat;
      position: relative;
    }

    /* Window to show weather outside */
    .window {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 200px;
      height: 150px;
      background: rgba(0,0,0,0.4);
      border: 4px solid #5b432a;
      box-shadow: inset 0 0 10px #000;
      overflow: hidden;
    }

    .weather {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .raindrop, .snowflake {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    .raindrop {
      width: 2px;
      height: 10px;
      animation: fall 1s linear infinite;
    }

    .snowflake {
      width: 5px;
      height: 5px;
      animation: snow 4s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(160px); }
    }

    @keyframes snow {
      0% { transform: translateY(-5px); opacity: 1; }
      100% { transform: translateY(160px); opacity: 0; }
    }

    /* Fireplace */
    .fireplace {
      position: absolute;
      bottom: 30px;
      left: 50px;
      width: 120px;
      height: 150px;
      background: url('https://i.imgur.com/AgYg8RY.png') center/contain no-repeat;
    }

    .flames {
      position: absolute;
      bottom: 40px;
      left: 75px;
      width: 40px;
      height: 60px;
      background: radial-gradient(ellipse at center, #ff4500 0%, #ff8c00 40%, transparent 70%);
      animation: flame-flicker 0.4s infinite alternate ease-in-out;
      border-radius: 50%;
    }

    @keyframes flame-flicker {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      100% { transform: scale(1.1) translateY(-5px); opacity: 0.7; }
    }

    /* Patrons (slight idle animation) */
    .patron {
      position: absolute;
      width: 80px;
      height: 160px;
      background: url('https://i.imgur.com/qHtDzox.png') center/contain no-repeat;
      animation: idle-sway 2.5s infinite alternate ease-in-out;
    }

    .patron:nth-child(1) {
      bottom: 40px;
      right: 200px;
    }

    .patron:nth-child(2) {
      bottom: 40px;
      right: 300px;
      animation-delay: 1s;
    }

    @keyframes idle-sway {
      0% { transform: rotate(-1deg) translateY(0); }
      100% { transform: rotate(1deg) translateY(2px); }
    }

    /* Controls */
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 5px;
    }

    .controls button {
      background: #5b432a;
      color: white;
      border: none;
      padding: 5px 10px;
      margin-right: 5px;
      cursor: pointer;
      font-family: 'Georgia';
    }

    .controls button:hover {
      background: #7a5c3c;
    }
  </style>
</head>
<body>
  <div class="tavern">
    <div class="controls">
      <button onclick="setWeather('rain')">🌧 Rain</button>
      <button onclick="setWeather('snow')">❄ Snow</button>
      <button onclick="clearWeather()">☀ Clear</button>
    </div>

    <div class="window">
      <div id="weather" class="weather"></div>
    </div>

    <div class="fireplace">
      <div class="flames"></div>
    </div>

    <div class="patron"></div>
    <div class="patron"></div>
  </div>

  <script>
    const weatherContainer = document.getElementById('weather');

    function createWeatherElement(type) {
      const el = document.createElement('div');
      if (type === 'rain') {
        el.classList.add('raindrop');
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
      } else if (type === 'snow') {
        el.classList.add('snowflake');
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (3 + Math.random() * 2) + 's';
      }
      return el;
    }

    let weatherType = null;
    let weatherInterval = null;

    function setWeather(type) {
      clearWeather();
      weatherType = type;
      weatherInterval = setInterval(() => {
        const el = createWeatherElement(type);
        weatherContainer.appendChild(el);
        setTimeout(() => weatherContainer.removeChild(el), 4000);
      }, 100);
    }

    function clearWeather() {
      clearInterval(weatherInterval);
      weatherContainer.innerHTML = '';
      weatherType = null;
    }
  </script>
</body>
</html>
