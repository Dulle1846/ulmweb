<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medieval Fantasy Tavern</title>
  <style>
    /* Global reset and tavern background */
    * { margin:0; padding:0; box-sizing:border-box; }
    body, html {
      width:100%; height:100%;
      overflow:hidden;
      background: #422a12 url('https://i.imgur.com/4YQpK1g.png') repeat-y; /* subtle wood texture */
      display:flex; justify-content:center; align-items:center;
      font-family: 'Cinzel', serif;
    }

    /* Main tavern container */
    #tavern {
      position: relative;
      width: 90vw; height: 80vh;
      background: #5c3a1d;
      border: 8px solid #3c220f;
      border-radius: 8px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    /* Fireplace */
    #fireplace {
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 300px; height: 200px;
      background: #3c220f;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
    }
    .fire {
      position: absolute;
      bottom: 10px; left:50%; transform: translateX(-50%);
      width: 80px; height: 80px;
      background: radial-gradient(circle at 50% 50%, #ffd452 20%, #ff6b00 80%);
      border-radius: 50% 50% 40% 40%;
      animation: flicker 0.15s infinite alternate;
    }
    @keyframes flicker {
      from { transform: translateX(-50%) scale(1); opacity: 1; }
      to   { transform: translateX(-49%) scale(1.1); opacity: 0.8; }
    }

    /* Patrons */
    .person {
      position: absolute;
      bottom: 20px;
      width: 60px; height: 120px;
      background: #7b4f24;
      border-radius: 10px 10px 0 0;
      transform-origin: bottom center;
      animation: sway 3s ease-in-out infinite;
    }
    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(2deg); }
    }
    #p1 { left:20%; animation-delay: 0s; }
    #p2 { left:40%; animation-delay: 1s; }
    #p3 { left:60%; animation-delay: 0.5s; }

    /* Window and weather */
    #window {
      position: absolute;
      top: 20px; right: 20px;
      width: 150px; height: 120px;
      background: #001;
      border: 6px solid #3c220f;
      border-radius: 4px;
      overflow: hidden;
    }
    /* Weather icons/text */
    #weather {
      position: absolute;
      top: 8px; left: 8px;
      color: #ddd; font-size: 16px;
    }
    /* Rain effect */
    .rain {
      position: absolute; top:0; left:0; width:100%; height:100%;
    }
    .rain:after {
      content: ""; position:absolute; width:2px; height:15px;
      background: rgba(200,200,255,0.6);
      animation: drop 0.5s linear infinite;
    }
    @keyframes drop {
      0%   { transform: translateY(-20px) translateX(0); opacity:1; }
      100% { transform: translateY(120px) translateX(5px); opacity:0; }
    }
    /* Snow effect */
    .snow {
      position: absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none;
    }
    .snow:after {
      content: "❆"; position:absolute;
      font-size:14px; color: #eef;
      animation: fall 3s linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-10px) translateX(0); opacity:1; }
      100% { transform: translateY(130px) translateX(20px); opacity:0; }
    }
  </style>
</head>
<body>
  <div id="tavern">
    <div id="fireplace">
      <div class="fire"></div>
    </div>
    <div class="person" id="p1"></div>
    <div class="person" id="p2"></div>
    <div class="person" id="p3"></div>
    <div id="window">
      <div id="weather">Loading...</div>
    </div>
  </div>

  <script>
    // Replace with your OpenWeatherMap API key
    const API_KEY = 'YOUR_API_KEY';
    const CITY_ID = '2950159'; // Berlin, DE (change as you like)
    const url = `https://api.openweathermap.org/data/2.5/weather?id=${CITY_ID}&units=metric&appid=${API_KEY}`;

    function updateWeather(data) {
      const desc = data.weather[0].main.toLowerCase();
      const temp = Math.round(data.main.temp);
      const wEl = document.getElementById('weather');
      wEl.textContent = `${desc.charAt(0).toUpperCase()+desc.slice(1)}, ${temp}°C`;

      const win = document.getElementById('window');
      // Clear previous weather effects
      win.querySelectorAll('.rain, .snow').forEach(el => el.remove());

      if (desc.includes('rain')) {
        const rain = document.createElement('div');
        rain.className = 'rain';
        win.append(rain);
      } else if (desc.includes('snow')) {
        const snow = document.createElement('div');
        snow.className = 'snow';
        win.append(snow);
      }
      // Clear for clear or clouds—only text shown
    }

    fetch(url)
      .then(res => res.json())
      .then(updateWeather)
      .catch(err => {
        console.error(err);
        document.getElementById('weather').textContent = '—';
      });

    // Auto-refresh every 10 minutes
    setInterval(() => fetch(url).then(r => r.json()).then(updateWeather), 600000);
  </script>
</body>
</html>
