<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Fantasy Tavern</title>
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif;
      background-color: #2b1d0e; /* Dark tavern-like background */
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5em;
      color: #ffd700; /* Gold color for a fantasy feel */
      text-shadow: 2px 2px 4px #000;
    }

    .tavern-scene {
      position: relative;
      width: 80%;
      max-width: 800px;
      height: 400px;
      background-image: url('https://images.unsplash.com/photo-1549924231-f129b911e442?ixlib=rb-4.0.1&auto=format&fit=crop&w=1470&q=80'); /* Placeholder background */
      background-size: cover;
      background-position: center;
      border: 5px solid #654321; /* Oak frame for the tavern scene */
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Character styles */
    .character {
      position: absolute;
      bottom: 0;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .character:hover {
      transform: scale(1.1);
    }

    /* Positioning characters within the scene */
    .bard {
      left: 15%;
      width: 80px;
      height: 150px;
    }

    .knight {
      right: 15%;
      width: 80px;
      height: 150px;
    }

    /* Message box styles */
    .message-box {
      margin-top: 20px;
      width: 80%;
      max-width: 800px;
      min-height: 50px;
      padding: 15px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      font-size: 1.2em;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Fantasy Tavern!</h1>
  </header>

  <div class="tavern-scene" id="tavernScene">
    <!-- Characters as clickable images -->
    <img 
      src="https://images.unsplash.com/photo-1616719178203-0a55f8279f68?ixlib=rb-4.0.1&auto=format&fit=crop&w=80&q=80" 
      alt="Bard" 
      class="character bard" 
      id="bard"
      title="Click to talk to the Bard"
    />

    <img 
      src="https://images.unsplash.com/photo-1628857034910-e8e4a3b1f8c0?ixlib=rb-4.0.1&auto=format&fit=crop&w=80&q=80" 
      alt="Knight" 
      class="character knight" 
      id="knight"
      title="Click to talk to the Knight"
    />
  </div>

  <div class="message-box" id="messageBox">
    Welcome! Click on a character to hear their story or get a quest.
  </div>

  <script>
    // JavaScript for interactivity

    // Get references to elements  
    const messageBox = document.getElementById('messageBox');
    const bard = document.getElementById('bard');
    const knight = document.getElementById('knight');

    // Define character dialogues  
    const dialogues = {
      bard: [
        "Greetings, traveler! Want to hear a song?",
        "I've traveled far and wide. Care for a tale?",
        "Stay a while and listen!"
      ],
      knight: [
        "Halt! What brings you to these parts?",
        "I defend the realm from danger.",
        "May your sword be sharp and your heart brave!"
      ]
    };

    // Function to handle click and display dialogue  
    function talk(character) {
      const options = dialogues[character];
      // Pick a random dialogue  
      const message = options[Math.floor(Math.random() * options.length)];
      // Update the message box  
      messageBox.textContent = message;
    }

    // Add event listeners  
    bard.addEventListener('click', () => talk('bard'));
    knight.addEventListener('click', () => talk('knight'));

    // Optional: Add a way to reset or clear message  
    messageBox.addEventListener('click', () => {
      messageBox.textContent = "Welcome! Click on a character to hear their story or get a quest.";
    });
  </script>
</body>
</html>
