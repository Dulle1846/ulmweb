<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German Football Tournament</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }

    .button-container {
      position: sticky;
      top: 10px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      background-color: rgba(18, 18, 18, 0.7);
      padding: 10px;
      backdrop-filter: blur(5px);
    }

    .main-button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 10px;
      transition: transform 0.2s;
    }

    .main-button:hover {
      transform: scale(1.05);
    }

    .main-button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .tournament-container {
      padding: 20px;
      padding-top: 80px;
    }

    .tournament-tree {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin: 0 auto;
      width: 95%;
      max-width: 1400px;
      padding: 10px;
      background-color: rgba(30,30,30,0.8);
      border-radius: 10px;
    }

    .round {
      flex: 0 0 auto;
      margin: 0 10px;
      min-width: 180px;
    }

    .round h3 {
      text-align: center;
      margin-top: 0;
      color: #4CAF50;
    }

    .match {
      background: #222;
      border: 1px solid #444;
      border-radius: 5px;
      margin-bottom: 10px;
      padding: 5px;
    }

    .team {
      padding: 8px;
      margin: 4px 0;
      background-color: #333;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;
    }

    .score {
      margin-left: 10px;
      font-weight: bold;
      color: #4CAF50;
    }

    .winner {
      background-color: #4CAF50;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
      position: sticky;
      top: 0;
      background-color: #121212;
      padding: 15px 0;
      z-index: 999;
    }

    .club-count {
      text-align: center;
      margin-bottom: 20px;
      color: #aaa;
    }

    .history-log {
      max-width: 800px;
      margin: 20px auto;
      padding: 15px;
      background-color: rgba(30,30,30,0.8);
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

    <button class="main-button" id="playButton" disabled>Play Matches</button>
    <button class="main-button" id="historyButton">History</button>
    <button class="main-button" id="resetButton" disabled>Reset Tournament</button>
  </div>

      // Additional historic/well-known clubs
      "Kickers Offenbach", "Alemannia Aachen", "Wuppertaler SV", "Rot-Weiss Essen",
      "FC 08 Homburg", "SV Darmstadt 98", "1. FC Kaiserslautern", "MSV Duisburg",
      "Fortuna Düsseldorf", "Hannover 96", "Karlsruher SC", "1. FC Nürnberg",
      "FC St. Pauli", "VfL Osnabrück", "Arminia Bielefeld", "Dynamo Dresden",
      "FC Carl Zeiss Jena", "1. FC Magdeburg", "Hansa Rostock", "Energie Cottbus",
      "FC Erzgebirge Aue", "FSV Zwickau", "VfB Leipzig", "Chemnitzer FC",
      "1. FC Lokomotive Leipzig", "BFC Dynamo", "Union Berlin", "Tennis Borussia Berlin",
      "Blau-Weiß 90 Berlin", "Viktoria Berlin", "FC Viktoria 1889 Berlin", "Berliner AK 07",
      "SV Babelsberg 03", "FSV Union Fürstenwalde", "FC Rot-Weiß Erfurt", "FC Carl Zeiss Jena",

      "Hansa Rostock", "Energie Cottbus", "FC Erzgebirge Aue", "FSV Zwickau",
      "VfB Leipzig", "Chemnitzer FC", "1. FC Lokomotive Leipzig", "BFC Dynamo"
    ];

    // Remove duplicates and create unique club list
    const uniqueClubs = [...new Set(clubs)];
    let availableClubs = [...uniqueClubs];
    let drawnClubs = [];
    let currentRound = 0;
    const totalRounds = 6; // 32 → 16 → 8 → 4 → 2 → 1
    let tournamentHistory = [];

    const treeContainer = document.getElementById('tournament-tree');
    const drawButton = document.getElementById('drawButton');
    const playButton = document.getElementById('playButton');
    const historyButton = document.getElementById('historyButton');
    const resetButton = document.getElementById('resetButton');
    const clubCount = document.getElementById('clubCount');
    const historyLog = document.getElementById('history-log');

    function updateClubCount() {
      clubCount.textContent = `Verfügbare Vereine: ${availableClubs.length} | Ausgeloste Vereine: ${drawnClubs.length}`;
    }

    function createInitialBracket() {
      treeContainer.innerHTML = '';
      let matches = 32; // Start with round of 32
      
      for (let r = 0; r < totalRounds; r++) {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        roundDiv.dataset.round = r;
        
        let roundName;
        if (r === totalRounds-1) roundName = 'Finale';
        else if (r === totalRounds-2) roundName = 'Halbfinale';
        else if (r === totalRounds-3) roundName = 'Viertelfinale';
        else if (r === totalRounds-4) roundName = 'Achtelfinale';
        else roundName = `${matches}te Runde`;
        
        roundDiv.innerHTML = `<h3>${roundName}</h3>`;
        
        for (let m = 0; m < matches; m++) {
          const matchDiv = document.createElement('div');
          matchDiv.className = 'match';
          matchDiv.dataset.match = m;
          matchDiv.dataset.round = r;

          const team1 = document.createElement('div');
          team1.className = 'team';
          team1.dataset.team = "1";
          team1.dataset.score = "0";

          const team2 = document.createElement('div');
          team2.className = 'team';
          team2.dataset.team = "2";
          team2.dataset.score = "0";

          matchDiv.appendChild(team1);
          matchDiv.appendChild(team2);
          roundDiv.appendChild(matchDiv);
        }
        matches = matches / 2;
        treeContainer.appendChild(roundDiv);
      }
    }

    function drawNextClub() {
      if (availableClubs.length === 0) {
        drawButton.textContent = 'Alle Vereine ausgelost';
        drawButton.disabled = true;
        playButton.disabled = false;
        return;
      }
      
      const randomIndex = Math.floor(Math.random() * availableClubs.length);
      const club = availableClubs.splice(randomIndex, 1)[0];
      drawnClubs.push(club);
      
      const firstRound = treeContainer.querySelector('.round[data-round="0"]');
      const matchList = firstRound.querySelectorAll('.match');

      for (let match of matchList) {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        
        if (!t1.textContent) {
          t1.textContent = club;
          updateClubCount();
          return;
        } else if (!t2.textContent) {
          t2.textContent = club;
          updateClubCount();
          return;
        }
      }
    }

    function playMatches() {
      const currentRoundMatches = treeContainer.querySelector(`.round[data-round="${currentRound}"]`).querySelectorAll('.match');
      let allMatchesPlayed = true;

      // Check if all teams are set for this round
      for (let match of currentRoundMatches) {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        
        if (!t1.textContent || !t2.textContent) {
          allMatchesPlayed = false;
          break;
        }
      }

      if (!allMatchesPlayed) {
        alert("Nicht alle Paarungen sind komplett! Bitte erst alle Teams für diese Runde setzen.");
        return;
      }

      // Play all matches in current round
      const roundResults = [];
      
      for (let match of currentRoundMatches) {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        
        // Only play if not already played
        if (!t1.dataset.score || t1.dataset.score === "0") {
          const score1 = Math.floor(Math.random() * 5); // 0-4 goals
          const score2 = Math.floor(Math.random() * 5); // 0-4 goals
          
          // Add penalty shootout chance for draws
          let finalScore1 = score1;
          let finalScore2 = score2;
          
          if (score1 === score2) {
            // 50% chance for penalty shootout (1-1 becomes 1-1 (4-5))
            if (Math.random() > 0.5) {
              finalScore1 = score1 + (Math.random() > 0.5 ? 0 : 1);
              finalScore2 = score2 + (finalScore1 > score1 ? 0 : 1);
            }
          }
          
          t1.dataset.score = finalScore1;
          t2.dataset.score = finalScore2;
          
          t1.innerHTML = `${t1.textContent} <span class="score">${finalScore1}</span>`;
          t2.innerHTML = `${t2.textContent} <span class="score">${finalScore2}</span>`;
          
          // Mark winner and add to history
          if (finalScore1 > finalScore2) {
            t1.classList.add('winner');
            promoteWinner(t1.textContent, match.dataset.round, match.dataset.match);
            roundResults.push(`${t1.textContent} ${finalScore1}-${finalScore2} ${t2.textContent}`);
          } else {
            t2.classList.add('winner');
            promoteWinner(t2.textContent, match.dataset.round, match.dataset.match);
            roundResults.push(`${t1.textContent} ${finalScore1}-${finalScore2} ${t2.textContent}`);
          }
        }
      }

      // Add round results to history
      tournamentHistory.push({
        round: currentRound,
        matches: roundResults
      });

      currentRound++;
      
      if (currentRound >= totalRounds) {
        playButton.textContent = 'Turnier beendet';
        playButton.disabled = true;
        resetButton.disabled = false;
        
        // Add tournament winner to history
        const finalMatch = treeContainer.querySelector(`.round[data-round="${totalRounds-1}"] .match`);
        const winner = finalMatch.querySelector('.winner').textContent;
        tournamentHistory.push({
          winner: winner
        });
      } else {
        playButton.textContent = `Runde ${currentRound + 1} spielen`;
      }
    }

    function promoteWinner(teamName, currentRound, matchIndex) {
      const nextRound = parseInt(currentRound) + 1;
      if (nextRound >= totalRounds) return;
      
      const nextRoundMatches = treeContainer.querySelector(`.round[data-round="${nextRound}"]`).querySelectorAll('.match');
      const targetMatchIndex = Math.floor(parseInt(matchIndex) / 2);
      const targetMatch = nextRoundMatches[targetMatchIndex];
      
      const t1 = targetMatch.querySelector('[data-team="1"]');
      const t2 = targetMatch.querySelector('[data-team="2"]');
      
      if (!t1.textContent) {
        t1.textContent = teamName;
      } else if (!t2.textContent) {
        t2.textContent = teamName;
      }
    }

    function showHistory() {
      historyLog.innerHTML = '<h3>Turnierverlauf</h3>';
      
      tournamentHistory.forEach(entry => {
        if (entry.winner) {
          historyLog.innerHTML += `<p><strong>Turniersieger: ${entry.winner}</strong></p>`;
        } else {
          historyLog.innerHTML += `<h4>Runde ${entry.round + 1}</h4>`;
          entry.matches.forEach(match => {
            historyLog.innerHTML += `<p>${match}</p>`;
          });
        }
      });
      
      historyLog.style.display = 'block';
    }

    function resetTournament() {
      availableClubs = [...uniqueClubs];
      drawnClubs = [];
      currentRound = 0;
      tournamentHistory = [];
      
      drawButton.textContent = 'Draw Club';
      drawButton.disabled = false;
      
      playButton.textContent = 'Play Matches';
      playButton.disabled = true;
      
      resetButton.disabled = true;
      
      createInitialBracket();
      updateClubCount();
      historyLog.style.display = 'none';
    }

    drawButton.addEventListener('click', drawNextClub);
    playButton.addEventListener('click', playMatches);
    historyButton.addEventListener('click', showHistory);
    resetButton.addEventListener('click', resetTournament);

    // Initialize
    createInitialBracket();
    updateClubCount();
  </script>
</body>
</html>
