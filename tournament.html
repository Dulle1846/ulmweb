<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German Football Tournament</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }

    .button-container {
      position: sticky;
      top: 10px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      background-color: rgba(18, 18, 18, 0.7);
      padding: 10px;
      backdrop-filter: blur(5px);
    }

    .main-button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 10px;
      transition: transform 0.2s;
    }

    .main-button:hover {
      transform: scale(1.05);
    }

    .main-button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .tournament-container {
      padding: 20px;
      padding-top: 80px;
    }

    .tournament-tree {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin: 0 auto;
      width: 95%;
      max-width: 1400px;
      padding: 10px;
      background-color: rgba(30,30,30,0.8);
      border-radius: 10px;
    }

    .round {
      flex: 0 0 auto;
      margin: 0 10px;
      min-width: 180px;
    }

    .round h3 {
      text-align: center;
      margin-top: 0;
      color: #4CAF50;
    }

    .match {
      background: #222;
      border: 1px solid #444;
      border-radius: 5px;
      margin-bottom: 10px;
      padding: 5px;
    }

    .team {
      padding: 8px;
      margin: 4px 0;
      background-color: #333;
      border-radius: 3px;
    }

    .winner {
      background-color: #4CAF50;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
      position: sticky;
      top: 0;
      background-color: #121212;
      padding: 15px 0;
      z-index: 999;
    }
  </style>
</head>
<body>
  <h1>German Football Tournament</h1>
  
  <div class="button-container">
    <button class="main-button" id="drawButton">Draw Club</button>
    <button class="main-button" id="historyButton">History</button>
  </div>

  <div class="tournament-container">
    <div class="tournament-tree" id="tournament-tree"></div>
    <div id="history-log" style="max-width:800px;margin:20px auto;display:none;"></div>
  </div>

  <script>
    const clubs = [
      // Bundesliga (1. Liga)
      "FC Bayern München", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "VfB Stuttgart", 
      "Eintracht Frankfurt", "SC Freiburg", "TSG Hoffenheim", "1. FSV Mainz 05", "Werder Bremen", 
      "Borussia Mönchengladbach", "VfL Bochum", "FC Augsburg", "1. FC Union Berlin", "1. FC Köln", 
      "SV Darmstadt 98", "FC Heidenheim", "VfL Wolfsburg",
      
      // 2. Bundesliga
      "Hamburger SV", "Fortuna Düsseldorf", "1. FC Nürnberg", "Hertha BSC", "SC Paderborn 07", 
      "Holstein Kiel", "Hannover 96", "FC St. Pauli", "1. FC Kaiserslautern", "Karlsruher SC", 
      "SpVgg Greuther Fürth", "SV Elversberg", "Eintracht Braunschweig", "VfL Osnabrück", 
      "SV Wehen Wiesbaden", "SSV Ulm 1846", "Hansa Rostock", "Arminia Bielefeld",
      
      // 3. Liga
      "Preußen Münster", "Rot-Weiss Essen", "Viktoria Köln", "1. FC Saarbrücken", "Hallescher FC", 
      "MSV Duisburg", "SC Freiburg II", "Waldhof Mannheim", "SC Verl", "SV Sandhausen", 
      "FC Ingolstadt 04", "SpVgg Unterhaching", "Dynamo Dresden", "Erzgebirge Aue", 
      "Borussia Dortmund II", "1860 München", "VfB Lübeck", "Jahn Regensburg",
      
      // Regionalliga (4. Liga)
      // Nord
      "FC St. Pauli II", "VfB Oldenburg", "Hannover 96 II", "Werder Bremen II", "Teutonia Ottensen", 
      "Phönix Lübeck", "Drochtersen/Assel", "Havelse",
      // West
      "Fortuna Köln", "Rot-Weiß Oberhausen", "Wuppertaler SV", "Alemannia Aachen", "Schalke 04 II", 
      "FC Köln II", "Lippstadt 08", "Rödinghausen",
      // Südwest
      "FSV Frankfurt", "TSV Steinbach", "Kickers Offenbach", "FC 08 Homburg", "SV Elversberg II", 
      "Eintracht Trier", "Bahlinger SC", "Mainz 05 II",
      // Bayern
      "Bayern München II", "Nürnberg II", "Augsburg II", "Würzburger Kickers", "Viktoria Aschaffenburg", 
      "Schweinfurt 05", "Aubstadt", "Buchbach",
      // Nordost
      "Energie Cottbus", "Chemnitzer FC", "BFC Dynamo", "Lokomotive Leipzig", "ZFC Meuselwitz", 
      "Altglienicke", "VSG Altglienicke", "Hertha BSC II",
      
      // Oberliga (5. Liga)
      // Nord
      "Bremer SV", "Weiche Flensburg", "Heider SV", "Eintracht Norderstedt", "Altona 93", 
      // Süd
      "FC Pipinsried", "Schalding-Heining", "VfB Eichstätt", "Greuther Fürth II", 
      // Westfalen
      "Sportfreunde Lotte", "SC Wiedenbrück", "SV Rödinghausen II", "Preußen Münster II", 
      // Hessen
      "TSV Eintracht Stadtallendorf", "FC Gießen", "Baunatal", "FSC Lohfelden", 
      // Baden-Württemberg
      "Stuttgarter Kickers", "FC Nöttingen", "Göppinger SV", "Bissingen", 
      // Bayern
      "TSV 1860 Rosenheim", "VfR Garching", "DJK Vilzing", "ASV Neumarkt", 
      // Nordost-Nord
      "Torgelower SV Greif", "FC Mecklenburg Schwerin", "Malchower SV", "Greifswalder FC", 
      // Nordost-Süd
      "VfB Auerbach", "FC Eilenburg", "Bischofswerdaer FV", "Inter Leipzig",
      
      // Verbandsliga/Landesliga (6. Liga)
      // Ausgewählte bekannte Vereine
      "KFC Uerdingen", "Wormatia Worms", "VfR Mannheim", "FSV Zwickau", "Blau-Weiß 90 Berlin", 
      "Tennis Borussia Berlin", "VfB Stuttgart II", "Eintracht Frankfurt II", "Dresdner SC", 
      "VfB Leipzig", "FC Carl Zeiss Jena", "Rot-Weiss Frankfurt", "Viktoria Berlin", 
      "Berliner AK 07", "SV Babelsberg 03", "FC Viktoria 1889 Berlin", "1. FC Magdeburg II", 
      "Chemie Leipzig", "FC Erzgebirge Aue II", "FSV Union Fürstenwalde", "FC Rot-Weiß Erfurt"
    ];

    let availableClubs = [...clubs];

    const treeContainer = document.getElementById('tournament-tree');
    const drawButton = document.getElementById('drawButton');

    function createInitialBracket() {
      treeContainer.innerHTML = '';
      let roundCount = 6;
      let matches = 64;

      for (let r = 0; r < roundCount; r++) {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        roundDiv.innerHTML = `<h3>${r === roundCount-1 ? 'Finale' : r === roundCount-2 ? 'Halbfinale' : r === roundCount-3 ? 'Viertelfinale' : `${matches}te Runde`}</h3>`;
        for (let m = 0; m < matches; m++) {
          const matchDiv = document.createElement('div');
          matchDiv.className = 'match';

          const team1 = document.createElement('div');
          team1.className = 'team';
          team1.dataset.team = "1";
          const team2 = document.createElement('div');
          team2.className = 'team';
          team2.dataset.team = "2";

          matchDiv.appendChild(team1);
          matchDiv.appendChild(team2);
          roundDiv.appendChild(matchDiv);
        }
        matches = matches / 2;
        treeContainer.appendChild(roundDiv);
      }
    }

    function drawNextClub() {
      if (availableClubs.length === 0) {
        drawButton.textContent = 'Turnier starten';
        drawButton.disabled = true;
        return;
      }
      const randomIndex = Math.floor(Math.random() * availableClubs.length);
      const club = availableClubs.splice(randomIndex, 1)[0];
      const firstRound = treeContainer.querySelector('.round');
      const matchList = firstRound.querySelectorAll('.match');

      for (let match of matchList) {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        if (!t1.textContent) {
          t1.textContent = club;
          return;
        } else if (!t2.textContent) {
          t2.textContent = club;
          return;
        }
      }
    }

    drawButton.addEventListener('click', drawNextClub);

    createInitialBracket();
  </script>
</body>
</html>
