<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German Football Tournament</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #121212;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }

    .button-container {
      position: sticky;
      top: 10px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      background-color: rgba(18, 18, 18, 0.9);
      padding: 10px;
      backdrop-filter: blur(5px);
      border-radius: 10px;
      margin: 10px;
    }

    .main-button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 10px;
      transition: all 0.3s ease;
    }

    .main-button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }

    .main-button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .main-button.end-tournament {
      background: #FF6B6B;
    }

    .main-button.end-tournament:hover {
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
    }

    .tournament-container {
      padding: 20px;
      padding-top: 20px;
    }

    .tournament-tree {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin: 0 auto;
      width: 95%;
      max-width: 1600px;
      padding: 10px;
      background-color: rgba(30,30,30,0.9);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .round {
      flex: 0 0 auto;
      margin: 0 10px;
      min-width: 200px;
    }

    .round h3 {
      text-align: center;
      margin-top: 0;
      color: #4CAF50;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .match {
      background: linear-gradient(135deg, #222, #333);
      border: 1px solid #444;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .match:hover {
      border-color: #4CAF50;
      box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
    }

    .match.playable {
      border-color: #4CAF50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }

    .team {
      padding: 10px;
      margin: 4px 0;
      background-color: rgba(51, 51, 51, 0.8);
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      min-height: 20px;
    }

    .team.empty {
      background-color: rgba(85, 85, 85, 0.5);
      color: #999;
    }

    .score {
      margin-left: 10px;
      font-weight: bold;
      color: #4CAF50;
      font-size: 1.1rem;
    }

    .winner {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.5);
    }

    .loser {
      background-color: rgba(100, 100, 100, 0.6);
      color: #ccc;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #fff;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
      font-size: 2.5rem;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .club-count {
      text-align: center;
      margin: 20px 0;
      color: #4CAF50;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .progress-bar {
      width: 80%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin: 10px auto;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      transition: width 0.5s ease;
    }

    .history-log {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      background-color: rgba(30,30,30,0.9);
      border-radius: 10px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .history-round {
      margin-bottom: 20px;
      padding: 15px;
      background-color: rgba(50,50,50,0.5);
      border-radius: 8px;
    }

    .history-round h4 {
      color: #4CAF50;
      margin-top: 0;
    }

    .history-match {
      margin: 8px 0;
      padding: 8px;
      background-color: rgba(40,40,40,0.8);
      border-radius: 5px;
    }

    .tournament-winner {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      border-radius: 15px;
      margin: 20px 0;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5);
    }

    .tournament-summary {
      background-color: rgba(30,30,30,0.9);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .tournament-summary h3 {
      color: #4CAF50;
      margin-top: 0;
    }

    .participants-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 5px;
      margin: 10px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>German Football Tournament</h1>
  
  <div class="button-container">
    <button class="main-button" id="drawButton">Draw Club</button>
    <button class="main-button" id="playButton" disabled>Play Matches</button>
    <button class="main-button" id="historyButton">History</button>
    <button class="main-button" id="resetButton" disabled>Reset Tournament</button>
  </div>

  <div class="club-count" id="clubCount">Verfügbare Vereine: 0 | Ausgeloste Vereine: 0/64</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="tournament-container">
    <div class="tournament-tree" id="tournament-tree"></div>
    <div class="history-log" id="history-log"></div>
  </div>

  <script>
    // COMPLETE LIST OF ALL GERMAN CLUBS (1st-6th division)
    const clubs = [
      // 1. Bundesliga (2023/24)
      "FC Bayern München", "Borussia Dortmund", "RB Leipzig", "Bayer Leverkusen", "VfB Stuttgart",
      "Eintracht Frankfurt", "SC Freiburg", "TSG Hoffenheim", "1. FSV Mainz 05", "Werder Bremen",
      "Borussia Mönchengladbach", "VfL Bochum", "FC Augsburg", "1. FC Union Berlin", "1. FC Köln",
      "SV Darmstadt 98", "FC Heidenheim", "VfL Wolfsburg",

      // 2. Bundesliga (2023/24)
      "Hamburger SV", "Fortuna Düsseldorf", "1. FC Nürnberg", "Hertha BSC", "SC Paderborn 07",
      "Holstein Kiel", "Hannover 96", "FC St. Pauli", "1. FC Kaiserslautern", "Karlsruher SC",
      "SpVgg Greuther Fürth", "SV Elversberg", "Eintracht Braunschweig", "VfL Osnabrück",
      "SV Wehen Wiesbaden", "SSV Ulm 1846", "Hansa Rostock", "Arminia Bielefeld",

      // 3. Liga (2023/24)
      "Preußen Münster", "Rot-Weiss Essen", "Viktoria Köln", "1. FC Saarbrücken", "Hallescher FC",
      "MSV Duisburg", "SC Freiburg II", "Waldhof Mannheim", "SC Verl", "SV Sandhausen",
      "FC Ingolstadt 04", "SpVgg Unterhaching", "Dynamo Dresden", "Erzgebirge Aue",
      "Borussia Dortmund II", "1860 München", "VfB Lübeck", "Jahn Regensburg", "SV Meppen",

      // Regionalliga (4. Liga - 2023/24)
      // Nord
      "FC St. Pauli II", "VfB Oldenburg", "Hannover 96 II", "Werder Bremen II", "Teutonia Ottensen",
      "Phönix Lübeck", "Drochtersen/Assel", "Havelse", "Weiche Flensburg", "Eintracht Norderstedt",
      "Holstein Kiel II", "Altona 93", "SC Spelle-Venhaus", "Heider SV", "Lüneburger SK Hansa",
      "Bremer SV", "VfB Lübeck II", "FC Teutonia Ottensen",
      // West
      "Fortuna Köln", "Rot-Weiß Oberhausen", "Wuppertaler SV", "Alemannia Aachen", "Schalke 04 II",
      "FC Köln II", "Lippstadt 08", "Rödinghausen", "Borussia M'gladbach II", "SC Fortuna Köln",
      "SV Straelen", "FC Wegberg-Beeck", "SV Lippstadt 08", "Bonner SC", "SC Wiedenbrück",
      "SV Rödinghausen", "FC Gütersloh", "Sportfreunde Lotte",
      // Südwest
      "FSV Frankfurt", "TSV Steinbach", "Kickers Offenbach", "FC 08 Homburg", "SV Elversberg II",
      "Eintracht Trier", "Bahlinger SC", "Mainz 05 II", "FK Pirmasens",
      "TSG Balingen", "FC Astoria Walldorf", "TSV Schott Mainz", "TuS Koblenz", "SV Eintracht Trier 05",
      "FSV Salmrohr", "SC Hauenstein", "Wormatia Worms", "VfR Mannheim",
      // Bayern
      "Bayern München II", "Nürnberg II", "Augsburg II", "Würzburger Kickers", "Viktoria Aschaffenburg",
      "Schweinfurt 05", "Aubstadt", "Buchbach", "TSV 1860 Rosenheim", "VfR Garching",
      "DJK Vilzing", "ASV Neumarkt", "FC Pipinsried", "SpVgg Ansbach 09", "TSV Rain am Lech", "SV Schalding-Heining",
      "FC Memmingen", "SpVgg Bayreuth", "VfB Eichstätt", "TSV 1860 München II",
      // Nordost
      "Energie Cottbus", "Chemnitzer FC", "BFC Dynamo", "Lokomotive Leipzig", "ZFC Meuselwitz",
      "Altglienicke", "VSG Altglienicke", "Hertha BSC II", "FC Carl Zeiss Jena", "FSV Union Fürstenwalde",
      "FC Eilenburg", "FSV Optik Rathenow", "SV Babelsberg 03", "Tennis Borussia Berlin", "FC Viktoria 1889 Berlin", "Berliner AK 07",
      "SV Lichtenberg 47", "FC Rot-Weiß Erfurt", "FSV 63 Luckenwalde", "1. FC Frankfurt",

      // Additional clubs to reach 64+
      "Stuttgarter Kickers", "FC Nöttingen", "Göppinger SV", "Bissingen", "KSV Hessen Kassel",
      "FC Gießen", "Baunatal", "FSC Lohfelden", "TSV Eintracht Stadtallendorf", "SV Waldhof Mannheim II",
      "Torgelower SV Greif", "FC Mecklenburg Schwerin", "Malchower SV", "Greifswalder FC", "Hansa Rostock II",
      "VfB Auerbach", "FC Eilenburg II", "Bischofswerdaer FV", "Inter Leipzig", "Chemnitzer FC II",
      "KFC Uerdingen", "FSV Zwickau", "Blau-Weiß 90 Berlin", "Dresdner SC", "VfB Leipzig",
      "Chemie Leipzig", "FC Erzgebirge Aue II", "1. FC Magdeburg", "Rot-Weiss Frankfurt", "Viktoria Berlin",
      "SV Darmstadt 98 II", "1. FC Saarbrücken II", "FC Homburg", "TSG Hoffenheim II", "SSV Ulm 1846 II",
      "FC Ingolstadt 04 II", "SpVgg Unterhaching II", "VfL Wolfsburg II", "Eintracht Braunschweig II",
      "SV Meppen II", "Preußen Münster II", "Rot-Weiss Essen II", "1. FC Köln II", "Fortuna Düsseldorf II",
      "Bayer Leverkusen II", "VfB Stuttgart II", "Eintracht Frankfurt II", "SC Freiburg II", "SV Werder Bremen II",
      "VfL Bochum II", "FC Augsburg II", "1. FC Union Berlin II", "1. FSV Mainz 05 II", "Arminia Bielefeld II",
      "FC Carl Zeiss Jena II", "Dynamo Dresden II", "Erzgebirge Aue II", "FSV Zwickau II", "VfB Leipzig II"
    ];

    // Remove duplicates and create unique club list
    const uniqueClubs = [...new Set(clubs)];
    let availableClubs = [...uniqueClubs];
    let drawnClubs = [];
    let currentRound = 0;
    const totalRounds = 6; // 64 → 32 → 16 → 8 → 4 → 2 → 1
    let tournamentHistory = [];
    let currentMatchesToPlay = [];
    let tournamentCompleted = false;
    let tournamentWinner = null;
    let participatingClubs = [];

    const treeContainer = document.getElementById('tournament-tree');
    const drawButton = document.getElementById('drawButton');
    const playButton = document.getElementById('playButton');
    const historyButton = document.getElementById('historyButton');
    const resetButton = document.getElementById('resetButton');
    const clubCount = document.getElementById('clubCount');
    const historyLog = document.getElementById('history-log');
    const progressFill = document.getElementById('progressFill');

    function updateClubCount() {
      clubCount.textContent = `Verfügbare Vereine: ${availableClubs.length} | Ausgeloste Vereine: ${drawnClubs.length}/64`;
      const progress = (drawnClubs.length / 64) * 100;
      progressFill.style.width = progress + '%';
    }

    function createInitialBracket() {
      treeContainer.innerHTML = '';
      let matches = 32; // Start with 32 matches (64 teams)
      
      for (let r = 0; r < totalRounds; r++) {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        roundDiv.dataset.round = r;
        
        let roundName;
        if (r === totalRounds-1) roundName = 'Finale';
        else if (r === totalRounds-2) roundName = 'Halbfinale';
        else if (r === totalRounds-3) roundName = 'Viertelfinale';
        else if (r === totalRounds-4) roundName = 'Achtelfinale';
        else if (r === totalRounds-5) roundName = 'Sechzehntelfinale';
        else roundName = 'Zweiunddreißigstelfinale';
        
        roundDiv.innerHTML = `<h3>${roundName}</h3>`;
        
        for (let m = 0; m < matches; m++) {
          const matchDiv = document.createElement('div');
          matchDiv.className = 'match';
          matchDiv.dataset.match = m;
          matchDiv.dataset.round = r;

          const team1 = document.createElement('div');
          team1.className = 'team empty';
          team1.dataset.team = "1";
          team1.textContent = 'TBD';

          const team2 = document.createElement('div');
          team2.className = 'team empty';
          team2.dataset.team = "2";
          team2.textContent = 'TBD';

          matchDiv.appendChild(team1);
          matchDiv.appendChild(team2);
          roundDiv.appendChild(matchDiv);
        }
        matches = matches / 2;
        treeContainer.appendChild(roundDiv);
      }
    }

    function drawNextClub() {
      if (currentRound === 0) {
        // First round - draw all 64 clubs
        if (drawnClubs.length >= 64) {
          drawButton.textContent = 'Alle 64 Vereine ausgelost';
          drawButton.disabled = true;
          playButton.disabled = false;
          playButton.textContent = 'Spiele Zweiunddreißigstelfinale';
          participatingClubs = [...drawnClubs]; // Save participating clubs
          setupCurrentRoundMatches();
          return;
        }
        
        if (availableClubs.length === 0) {
          alert('Keine Vereine mehr verfügbar!');
          return;
        }
        
        const randomIndex = Math.floor(Math.random() * availableClubs.length);
        const club = availableClubs.splice(randomIndex, 1)[0];
        drawnClubs.push(club);
        
        const firstRound = treeContainer.querySelector('.round[data-round="0"]');
        const matchList = firstRound.querySelectorAll('.match');

        for (let match of matchList) {
          const t1 = match.querySelector('[data-team="1"]');
          const t2 = match.querySelector('[data-team="2"]');
          
          if (t1.textContent === 'TBD') {
            t1.textContent = club;
            t1.classList.remove('empty');
            updateClubCount();
            return;
          } else if (t2.textContent === 'TBD') {
            t2.textContent = club;
            t2.classList.remove('empty');
            updateClubCount();
            return;
          }
        }
      } else {
        // Later rounds - draw matchups from winners
        drawCurrentRound();
      }
    }

    function drawCurrentRound() {
      const currentRoundDiv = treeContainer.querySelector(`.round[data-round="${currentRound}"]`);
      const matches = currentRoundDiv.querySelectorAll('.match');
      
      // Get all winners from previous round
      const previousRoundDiv = treeContainer.querySelector(`.round[data-round="${currentRound - 1}"]`);
      const previousMatches = previousRoundDiv.querySelectorAll('.match');
      const winners = [];
      
      previousMatches.forEach(match => {
        const winner = match.querySelector('.winner');
        if (winner) {
          // Extract team name without score
          const teamName = winner.textContent.split(' ')[0];
          // If team name has multiple words, reconstruct it
          const words = winner.textContent.split(' ');
          let name = '';
          for (let i = 0; i < words.length; i++) {
            if (!words[i].match(/^\d+$/)) { // Not a number (score)
              name += words[i] + ' ';
            } else {
              break;
            }
          }
          winners.push(name.trim());
        }
      });
      
      // Shuffle winners for random matchups
      for (let i = winners.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [winners[i], winners[j]] = [winners[j], winners[i]];
      }
      
      // Assign winners to matches
      let winnerIndex = 0;
      matches.forEach(match => {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        
        if (winnerIndex < winners.length) {
          t1.textContent = winners[winnerIndex];
          t1.classList.remove('empty');
          winnerIndex++;
        }
        
        if (winnerIndex < winners.length) {
          t2.textContent = winners[winnerIndex];
          t2.classList.remove('empty');
          winnerIndex++;
        }
      });
      
      drawButton.disabled = true;
      playButton.disabled = false;
      setupCurrentRoundMatches();
    }

    function setupCurrentRoundMatches() {
      // Clear previous playable matches
      document.querySelectorAll('.match.playable').forEach(match => {
        match.classList.remove('playable');
      });
      
      currentMatchesToPlay = [];
      const currentRoundDiv = treeContainer.querySelector(`.round[data-round="${currentRound}"]`);
      const matches = currentRoundDiv.querySelectorAll('.match');
      
      matches.forEach(match => {
        const t1 = match.querySelector('[data-team="1"]');
        const t2 = match.querySelector('[data-team="2"]');
        
        if (t1.textContent !== 'TBD' && t2.textContent !== 'TBD' && !t1.classList.contains('winner') && !t2.classList.contains('winner')) {
          match.classList.add('playable');
          currentMatchesToPlay.push(match);
        }
      });
      
      updatePlayButton();
    }

    function updatePlayButton() {
      const roundNames = ['Zweiunddreißigstelfinale', 'Sechzehntelfinale', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];
      
      if (currentMatchesToPlay.length > 0) {
        playButton.textContent = `${roundNames[currentRound]} - Nächstes Spiel (${currentMatchesToPlay.length} übrig)`;
        playButton.disabled = false;
      } else {
        playButton.textContent = 'Alle Spiele gespielt';
        playButton.disabled = true;
      }
    }

    function playMatches() {
      if (currentMatchesToPlay.length === 0) {
        updatePlayButton();
        return;
      }

      // Play only the next match
      const match = currentMatchesToPlay.shift();
      const t1 = match.querySelector('[data-team="1"]');
      const t2 = match.querySelector('[data-team="2"]');
      
      const team1Name = t1.textContent;
      const team2Name = t2.textContent;
      
      // Generate realistic scores
      let score1 = Math.floor(Math.random() * 4); // 0-3 goals
      let score2 = Math.floor(Math.random() * 4); // 0-3 goals
      
      // Handle draws with extra time/penalties
      if (score1 === score2) {
        if (Math.random() > 0.7) {
          // Extra time goal
          if (Math.random() > 0.5) {
            score1++;
          } else {
            score2++;
          }
        } else {
          // Penalty shootout
          if (Math.random() > 0.5) {
            score1++;
          } else {
            score2++;
          }
        }
      }
      
      t1.innerHTML = `${team1Name} <span class="score">${score1}</span>`;
      t2.innerHTML = `${team2Name} <span class="score">${score2}</span>`;
      
      // Mark winner and loser
      let winner, result;
      if (score1 > score2) {
        t1.classList.add('winner');
        t2.classList.add('loser');
        winner = team1Name;
        result = `${team1Name} ${score1}-${score2} ${team2Name}`;
      } else {
        t2.classList.add('winner');
        t1.classList.add('loser');
        winner = team2Name;
        result = `${team1Name} ${score1}-${score2} ${team2Name}`;
      }
      
      match.classList.remove('playable');
      
      // Add match result to history
      if (!tournamentHistory[currentRound]) {
        const roundNames = ['Zweiunddreißigstelfinale', 'Sechzehntelfinale', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];
        tournamentHistory[currentRound] = {
          round: currentRound,
          roundName: roundNames[currentRound],
          matches: []
        };
      }
      tournamentHistory[currentRound].matches.push(result);

      // Check if all matches in current round are done
      if (currentMatchesToPlay.length === 0) {
        // Round completed
        if (currentRound === totalRounds - 1) {
          // Tournament finished
          tournamentCompleted = true;
          tournamentWinner = winner;
          
          playButton.textContent = 'Turnier beendet';
          playButton.disabled = true;
          resetButton.disabled = false;
          historyButton.textContent = 'End Tournament';
          historyButton.classList.add('end-tournament');
          
          // Show winner celebration
          setTimeout(() => {
            alert(`🏆 Turniersieger: ${winner}! 🏆`);
          }, 500);
        } else {
          // Prepare next round
          currentRound++;
          const roundNames = ['Zweiunddreißigstelfinale', 'Sechzehntelfinale', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];
          drawButton.textContent = `Lose ${roundNames[currentRound]} aus`;
          drawButton.disabled = false;
          playButton.textContent = 'Erst Auslosung abwarten';
          playButton.disabled = true;
        }
      } else {
        // More matches to play in current round
        updatePlayButton();
      }
    }

    function showHistory() {
      if (tournamentCompleted && historyButton.textContent === 'End Tournament') {
        // Show final tournament summary
        historyLog.innerHTML = `
          <h3>Turnier beendet</h3>
          <div class="tournament-winner">🏆 Turniersieger: ${tournamentWinner} 🏆</div>
          <div class="tournament-summary">
            <h3>Turnier-Zusammenfassung</h3>
            <p><strong>Teilnehmende Vereine:</strong> ${participatingClubs.length}</p>
            <div class="participants-list">
              ${participatingClubs.map(club => `<div>${club}</div>`).join('')}
            </div>
          </div>
        `;
        
        // Add all round results
        tournamentHistory.forEach(entry => {
          const roundDiv = document.createElement('div');
          roundDiv.className = 'history-round';
          roundDiv.innerHTML = `<h4>${entry.roundName}</h4>`;
          
          entry.matches.forEach(match => {
            const matchDiv = document.createElement
