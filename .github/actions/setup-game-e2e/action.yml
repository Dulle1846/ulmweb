name: Set up game browser tests
description: Install the locked Node dependencies and a verified cached Playwright Chromium.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('game/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install browser test dependencies
      shell: bash
      working-directory: game
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Cache Playwright Chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('game/package-lock.json') }}

    - name: Install and verify Chromium
      shell: bash
      working-directory: game
      run: npm run test:e2e:setup -- --with-deps
