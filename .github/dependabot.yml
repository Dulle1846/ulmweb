# Dependency updates for the playable package. The npm manifest lives in
# game/, not at the repository root; pointing Dependabot at / made every
# scheduled npm update fail with dependency_file_not_found. There is no
# Dockerfile in this repository, so the old Docker entry is intentionally gone.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/game"
    schedule:
      interval: "daily"
    # Playwright pins the exact Chromium build used by the performance and
    # endurance gates. A minor jump changes that browser, so it needs a manual
    # benchmark run rather than an unattended dependency PR. Patch updates are
    # still proposed.
    ignore:
      - dependency-name: "playwright"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
