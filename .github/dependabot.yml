# Dependency updates for the playable package. The npm manifest lives in
# game/, not at the repository root; pointing Dependabot at / made every
# scheduled npm update fail with dependency_file_not_found. There is no
# Dockerfile in this repository, so the old Docker entry is intentionally gone.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/game"
    schedule:
      interval: "daily"
