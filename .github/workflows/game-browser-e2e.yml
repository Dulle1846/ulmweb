name: Game Browser E2E

# Stability sample 2: repeat the identical browser suite after the one-off failure.
# Stability sample 3: final repeated run for the same browser suite.
on:
  push:
    branches:
      - ulmweb-branch
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"
  pull_request:
    branches:
      - ulmweb-branch
      - kac-2.1-stability-performance
      - kac-3.1-strategy-final
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: game-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Chromium gameplay smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      started_at: ${{ steps.timing.outputs.started_at }}
      finished_at: ${{ steps.finish.outputs.finished_at }}
      e2e_exit_code: ${{ steps.browser-e2e.outputs.exit_code }}
    steps:
      - name: Record test start time
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        working-directory: game
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.56.1
      - name: Install Chromium, system libraries and fonts
        working-directory: game
        run: npm run test:e2e:setup -- --with-deps
      - name: Run local browser end-to-end test
        id: browser-e2e
        working-directory: game
        run: |
          set +e
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/browser-e2e.log"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload browser E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-browser-e2e-log
          path: ${{ runner.temp }}/browser-e2e.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload responsive UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-ui-viewport-review
          path: /tmp/kac-ui-viewport-review/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Record test finish time
        id: finish
        if: always()
        run: echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  record-run:
    name: Record workflow run receipt
    needs: browser-e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download browser E2E log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kings-and-cards-browser-e2e-log
          path: ${{ runner.temp }}/ci-artifacts
      - name: Create run receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          JOB_RESULT: ${{ needs.browser-e2e.result }}
          E2E_EXIT_CODE: ${{ needs.browser-e2e.outputs.e2e_exit_code }}
          STARTED_AT: ${{ needs.browser-e2e.outputs.started_at }}
          FINISHED_AT: ${{ needs.browser-e2e.outputs.finished_at }}
        run: |
          e2e_exit="${E2E_EXIT_CODE:-not-run}"
          started_at="${STARTED_AT:-unknown}"
          finished_at="${FINISHED_AT:-unknown}"
          if [ "${JOB_RESULT:-unknown}" = "success" ]; then
            overall_result="success"
          else
            overall_result="${JOB_RESULT:-unknown}"
          fi
          cat > "$RUNNER_TEMP/game-browser-e2e.json" <<JSON
          {
            "commit_sha": "${COMMIT_SHA}",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "workflow_name": "${WORKFLOW_NAME}",
            "run_url": "${RUN_URL}",
            "branch": "${BRANCH}",
            "started_at": "${started_at}",
            "finished_at": "${finished_at}",
            "job_status": "${JOB_RESULT:-unknown}",
            "workflow_result": "${overall_result}",
            "browser_e2e_exit_code": "${e2e_exit}"
          }
          JSON
      - name: Publish run receipt branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-run-receipts
          git rm -rf .
          mkdir -p ci
          cp "$RUNNER_TEMP/game-browser-e2e.json" ci/game-browser-e2e.json
          if [ -f "$RUNNER_TEMP/ci-artifacts/browser-e2e.log" ]; then
            cp "$RUNNER_TEMP/ci-artifacts/browser-e2e.log" ci/browser-e2e.log
            git add ci/browser-e2e.log
          fi
          git add ci/game-browser-e2e.json
          git commit -m "Record workflow run ${GITHUB_RUN_ID}"
          git push --force origin HEAD:refs/heads/ci-run-receipts
