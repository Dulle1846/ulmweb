name: Game Browser E2E

# The browser checks are independent of each other. Keep them in separate
# jobs so a slow cold-start or terrain audit cannot serialize the whole suite.
# The full 60-year endurance run lives in game-endurance-nightly.yml; every
# push still runs a 20-year browser audit with real saves, loads and FPS checks.
on:
  push:
    branches:
      - ulmweb-branch
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"
      - ".github/actions/setup-game-e2e/**"
  pull_request:
    branches:
      - ulmweb-branch
      - kac-2.1-stability-performance
      - kac-3.1-strategy-final
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"
      - ".github/actions/setup-game-e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-browser-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    name: Chromium gameplay smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      started_at: ${{ steps.timing.outputs.started_at }}
      finished_at: ${{ steps.finish.outputs.finished_at }}
      e2e_exit_code: ${{ steps.browser-e2e.outputs.exit_code }}
    steps:
      - name: Record test start time
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Run local browser end-to-end test
        id: browser-e2e
        working-directory: game
        timeout-minutes: 15
        run: |
          set +e
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/browser-e2e.log"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload browser E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-browser-e2e-log
          path: ${{ runner.temp }}/browser-e2e.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload responsive UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-ui-viewport-review
          path: /tmp/kac-ui-viewport-review/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Record test finish time
        id: finish
        if: always()
        run: echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  live-proofs:
    name: Live swamp and mountain proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Run swamp 1.2.11 live browser proof
        working-directory: game
        timeout-minutes: 5
        run: npm run test:swamp-live
      - name: Run mountain 1.2.12 live browser proof
        working-directory: game
        timeout-minutes: 5
        run: npm run test:mountain-live
      - name: Upload live proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-swamp-live-proof
          path: |
            artifacts/swamp-live-proof.png
            artifacts/swamp-live-proof-map.png
            artifacts/swamp-live-proof.json
            artifacts/mountain-live-proof.png
            artifacts/mountain-live-proof-map.png
            artifacts/mountain-live-proof.json
          if-no-files-found: warn
          retention-days: 7

  coldstart:
    name: Swamp cold-start comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Run swamp cold-start comparison
        working-directory: game
        timeout-minutes: 9
        run: npm run test:coldstart:compare
      - name: Upload cold-start artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-coldstart
          path: |
            artifacts/low-end-performance.json
            artifacts/swamp-coldstart-report.json
            artifacts/swamp-coldstart-swamp.json
            artifacts/swamp-coldstart-savanna.json
          if-no-files-found: warn
          retention-days: 7

  forester:
    name: Forester stewardship audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      exit_code: ${{ steps.forester-longrun.outputs.exit_code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Run three-seed Forester stewardship audit
        id: forester-longrun
        working-directory: game
        timeout-minutes: 6
        env:
          FORESTER_LONGTERM_OUT: ${{ runner.temp }}/forester-stewardship-longrun
          FORESTER_TIME_BUDGET_MS: 240000
        run: |
          set +e
          set -o pipefail
          npm run test:forester-stewardship-longrun 2>&1 | tee "$RUNNER_TEMP/forester-stewardship-longrun.log"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload Forester stewardship audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-forester-stewardship-longrun
          path: |
            ${{ runner.temp }}/forester-stewardship-longrun/forester-stewardship-longrun.json
            ${{ runner.temp }}/forester-stewardship-longrun/*.png
            ${{ runner.temp }}/forester-stewardship-longrun.log
          if-no-files-found: warn
          retention-days: 7

  terrain:
    name: Terrain and climate visual reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Generate terrain visual reference
        if: always()
        working-directory: game
        env:
          TERRAIN_REFERENCE_OUT: ${{ runner.temp }}/terrain-reference
        run: npm run test:terrain-reference
      - name: Simulate a full seasonal year
        if: always()
        working-directory: game
        env:
          SEASON_YEAR_OUT: ${{ runner.temp }}/terrain-reference/season-year.json
        run: npm run test:season-year
      - name: Generate climate reference and live screenshots
        if: always()
        working-directory: game
        env:
          CLIMATE_REFERENCE_OUT: ${{ runner.temp }}/terrain-reference
        run: npm run test:climate-reference
      - name: Generate forest ecology reference
        if: always()
        working-directory: game
        env:
          FOREST_REFERENCE_OUT: ${{ runner.temp }}/terrain-reference
        run: npm run test:forest-reference
      - name: Upload terrain visual reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-terrain-reference
          path: |
            ${{ runner.temp }}/terrain-reference/contact-sheet.png
            ${{ runner.temp }}/terrain-reference/season-transition.png
            ${{ runner.temp }}/terrain-reference/tree-seasons.png
            ${{ runner.temp }}/terrain-reference/reference.json
            ${{ runner.temp }}/terrain-reference/season-year.json
            ${{ runner.temp }}/terrain-reference/climate-reference.png
            ${{ runner.temp }}/terrain-reference/climate-reference.json
            ${{ runner.temp }}/terrain-reference/climate-live.png
            ${{ runner.temp }}/terrain-reference/climate-live.json
            ${{ runner.temp }}/terrain-reference/climate-live/*.png
            ${{ runner.temp }}/terrain-reference/forest-reference.png
            ${{ runner.temp }}/terrain-reference/forest-seasons.png
            ${{ runner.temp }}/terrain-reference/forest-reference.json
          if-no-files-found: warn
          retention-days: 7

  endurance-20y:
    name: 20-year browser endurance audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up cached browser dependencies
        uses: ./.github/actions/setup-game-e2e
      - name: Run 20-year browser endurance audit
        working-directory: game
        timeout-minutes: 22
        env:
          ENDURANCE_YEARS: 20
          ENDURANCE_STATE_DIR: ${{ runner.temp }}/endurance-20y-state
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 > "$RUNNER_TEMP/endurance-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:endurance
      - name: Upload endurance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-endurance-20y
          path: |
            game/reports/endurance-20y.json
            game/reports/endurance-20y.md
            artifacts/browser-endurance-20y-failure.json
          if-no-files-found: warn
          retention-days: 7

  record-run:
    name: Record workflow run receipt
    needs:
      - browser-e2e
      - forester
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download browser E2E log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kings-and-cards-browser-e2e-log
          path: ${{ runner.temp }}/ci-artifacts
      - name: Create run receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          JOB_RESULT: ${{ needs.browser-e2e.result }}
          E2E_EXIT_CODE: ${{ needs.browser-e2e.outputs.e2e_exit_code }}
          FORESTER_EXIT_CODE: ${{ needs.forester.outputs.exit_code || 'not-run' }}
          STARTED_AT: ${{ needs.browser-e2e.outputs.started_at }}
          FINISHED_AT: ${{ needs.browser-e2e.outputs.finished_at }}
        run: |
          e2e_exit="${E2E_EXIT_CODE:-not-run}"
          forester_exit="${FORESTER_EXIT_CODE:-not-run}"
          started_at="${STARTED_AT:-unknown}"
          finished_at="${FINISHED_AT:-unknown}"
          if [ "${JOB_RESULT:-unknown}" = "success" ]; then
            overall_result="success"
          else
            overall_result="${JOB_RESULT:-unknown}"
          fi
          cat > "$RUNNER_TEMP/game-browser-e2e.json" <<JSON
          {
            "commit_sha": "${COMMIT_SHA}",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "workflow_name": "${WORKFLOW_NAME}",
            "run_url": "${RUN_URL}",
            "branch": "${BRANCH}",
            "started_at": "${started_at}",
            "finished_at": "${finished_at}",
            "job_status": "${JOB_RESULT:-unknown}",
            "workflow_result": "${overall_result}",
            "browser_e2e_exit_code": "${e2e_exit}",
            "forester_longrun_exit_code": "${forester_exit}"
          }
          JSON
      - name: Publish run receipt branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-run-receipts
          git rm -rf .
          mkdir -p ci
          cp "$RUNNER_TEMP/game-browser-e2e.json" ci/game-browser-e2e.json
          if [ -f "$RUNNER_TEMP/ci-artifacts/browser-e2e.log" ]; then
            cp "$RUNNER_TEMP/ci-artifacts/browser-e2e.log" ci/browser-e2e.log
            git add ci/browser-e2e.log
          fi
          git add ci/game-browser-e2e.json
          git commit -m "Record workflow run ${GITHUB_RUN_ID}"
          git push --force origin HEAD:refs/heads/ci-run-receipts
