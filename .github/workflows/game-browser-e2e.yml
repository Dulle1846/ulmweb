name: Game Browser E2E

on:
  push:
    branches:
      - ulmweb-branch
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"
  pull_request:
    branches:
      - ulmweb-branch
      - kac-2.1-stability-performance
      - kac-3.1-strategy-final
    paths:
      - "game/**"
      - ".github/workflows/game-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: game-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Chromium gameplay smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        working-directory: game
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.56.1
      - name: Install Chromium, system libraries and fonts
        working-directory: game
        run: npm run test:e2e:setup -- --with-deps
      - name: Run local browser end-to-end test
        working-directory: game
        run: npm run test:e2e
      - name: Upload responsive UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-cards-ui-viewport-review
          path: /tmp/kac-ui-viewport-review/*.png
          if-no-files-found: warn
          retention-days: 7
