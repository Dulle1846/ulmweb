name: Game Quality

on:
  push:
    branches:
      - ulmweb-branch
    paths:
      - "game/**"
      - ".github/workflows/game-quality.yml"
  pull_request:
    branches:
      - ulmweb-branch
      - kac-2.1-stability-performance
      - kac-3.1-strategy-final
    paths:
      - "game/**"
      - ".github/workflows/game-quality.yml"

# Each commit gets its own quality run. Never cancel a check that belongs to a
# commit: a later push must not turn the earlier commit's suite into a red X.
concurrency:
  group: game-quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  game-quality:
    name: Game tests and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game tests and syntax check
        working-directory: game
        run: npm test
