<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Log Stream</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #000; /* Black background */
            color: #0f0; /* Green text for a classic terminal feel */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            background-color: #000;
            color: #0f0;
            padding: 20px 0;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #0f0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #0f0;
        }

        .log-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Space between log entries */
            padding-bottom: 50px; /* Room for loading indicator */
        }

        .log-entry {
            background-color: rgba(0, 255, 0, 0.05); /* Subtle green background */
            border: 1px solid #0f0;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
            transition: background-color 0.3s ease;
            overflow-x: auto; /* Allow horizontal scrolling for wide content */
        }

        .log-entry:hover {
            background-color: rgba(0, 255, 0, 0.15); /* Slightly brighter on hover */
        }

        .log-timestamp {
            color: #00ffff; /* Cyan for timestamps */
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            border-bottom: 1px dashed rgba(0, 255, 0, 0.3);
            padding-bottom: 5px;
        }

        .log-content {
            color: #0f0; /* Green for content */
            font-size: 0.95rem;
            white-space: pre-wrap; /* Preserve formatting but wrap text */
        }

        .log-content pre {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1;
            color: #0f0;
            margin: 10px 0;
            padding: 5px;
            background-color: rgba(0, 255, 0, 0.03);
            border: 1px dashed rgba(0, 255, 0, 0.1);
            overflow-x: auto; /* Ensure ASCII art doesn't break layout */
        }

        .loading-indicator {
            margin-top: 30px;
            padding: 15px;
            color: #fff;
            font-size: 1.2rem;
            display: none; /* Hidden by default */
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            display: inline-block;
            background-color: #ffd700; /* Gold button */
            color: #000; /* Black text on gold */
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid #000;
            border-radius: 5px;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px #000; /* Black shadow */
            z-index: 1000; /* Ensure it's above other content */
        }

        .back-link:hover {
            background-color: #000; /* Black on hover */
            color: #ffd700; /* Gold text on hover */
            box-shadow: 4px 4px 0px #ffd700; /* Gold shadow on hover */
            transform: translateY(-2px);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .log-entry {
                padding: 10px 15px;
            }
            .log-content {
                font-size: 0.85rem;
            }
            .log-content pre {
                font-size: 0.7rem;
            }
            .back-link {
                padding: 8px 15px;
                font-size: 0.8rem;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="https://dulle1846.github.io/ulmweb/" class="back-link">Back to Main</a>

    <div class="header">
        <h1>Infinite Log Stream</h1>
    </div>

    <div class="log-container" id="logContainer">
        <!-- Initial log entries will be loaded here by JavaScript -->
    </div>

    <div class="loading-indicator" id="loadingIndicator">Loading more data...</div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        let isLoading = false;
        let logEntryCounter = 0;

        // Arrays for procedural text generation
        const subjects = ["System", "User", "Process", "Network", "Database", "Sensor", "AI Core"];
        const actions = ["initiated", "completed", "failed", "detected", "analyzed", "optimized", "rebooted", "accessed"];
        const objects = ["task", "connection", "query", "anomaly", "data stream", "module", "protocol", "event"];
        const outcomes = ["successfully", "with warnings", "critical error", "unknown status", "pending review"];

        // Simple ASCII art snippets (keep them relatively small for embedding)
        const asciiArts = [
            `
  /\\_/\\
 ( o.o )
  > ^ <
            `,
            `
  +---+
  |   |
  +---+
            `,
            `
  <--->
  |   |
  <--->
            `,
            `
  .--.
 / _.-'
(  '-.
 '--'
            `
        ];

        // Function to generate a random log entry
        function generateLogEntry() {
            logEntryCounter++;
            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
            const subject = subjects[Math.floor(Math.random() * subjects.length)];
            const action = actions[Math.floor(Math.random() * actions.length)];
            const object = objects[Math.floor(Math.random() * objects.length)];
            const outcome = outcomes[Math.floor(Math.random() * outcomes.length)];

            let logText = `[${timestamp}] LOG-${String(logEntryCounter).padStart(5, '0')}: ${subject} ${action} ${object} ${outcome}.`;

            // Add a random ASCII art snippet occasionally
            if (Math.random() < 0.2) { // 20% chance to add ASCII art
                const art = asciiArts[Math.floor(Math.random() * asciiArts.length)];
                logText += `\n\n${art}`;
            }

            const entryDiv = document.createElement('div');
            entryDiv.classList.add('log-entry');
            entryDiv.innerHTML = `
                <span class="log-timestamp">${timestamp}</span>
                <div class="log-content">${logText}</div>
            `;
            return entryDiv;
        }

        // Function to load more log entries
        function loadMoreLogs() {
            if (isLoading) return;
            isLoading = true;
            loadingIndicator.style.display = 'block'; // Show loading indicator

            // Simulate network request delay
            setTimeout(() => {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 10; i++) { // Add 10 new log entries
                    fragment.appendChild(generateLogEntry());
                }
                logContainer.appendChild(fragment);

                isLoading = false;
                loadingIndicator.style.display = 'none'; // Hide loading indicator
            }, 1000); // 1 second delay
        }

        // Event listener for scrolling
        window.addEventListener('scroll', () => {
            // Check if user has scrolled to the bottom (within 200px threshold)
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
                loadMoreLogs();
            }
        });

        // Load initial logs when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadMoreLogs(); // Load first batch
            loadMoreLogs(); // Load second batch for initial scrollability
        });
    </script>
</body>
</html>
